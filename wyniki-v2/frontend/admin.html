<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administracyjny - Wyniki Live</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚙️</text></svg>">
  <script>
    // No session on this tab: go to the sign-in page before the panel is drawn.
    try {
      if (!sessionStorage.getItem('wyniki-admin-token')) {
        location.replace('/admin/login?next=' + encodeURIComponent(location.pathname + location.hash));
      }
    } catch (e) { /* storage blocked: the panel's own check sends you there */ }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="adm-body">
  <div x-data="adminApp" x-init="initAdminShell()" @admin-session-expired.window="handleAdminSessionExpired()" class="adm-app">
    <div class="adm-top">
      <span class="adm-top__brand">wyniki<span>.</span>admin</span>
      <span class="adm-top__tag">setup systemu i turniejów</span>
      <div class="adm-top__spacer"></div>
      <template x-if="adminActiveTournamentName()">
        <span class="adm-top__chip">
          <span aria-hidden="true">●</span>
          <span x-text="'Aktywny: ' + adminActiveTournamentName()"></span>
        </span>
      </template>
      <a class="adm-top__link" href="/" target="_blank" rel="noopener">Strona publiczna</a>
      <button type="button" class="adm-top__link" @click="logoutAdmin()">Wyloguj</button>
    </div>

    <div class="adm-shell">
      <nav class="adm-rail" aria-label="Sekcje panelu">
        <span class="adm-rail__title">SETUP</span>
        <template x-for="section in adminSections()" :key="section.id">
          <button
            type="button"
            class="adm-rail__item"
            :class="{ 'is-active': isAdminSection(section.id) }"
            :aria-current="isAdminSection(section.id) ? 'page' : false"
            @click="openAdminSection(section.id)"
            x-text="section.label"
          ></button>
        </template>
        <div class="adm-rail__office">
          <h2>Dzień turnieju prowadzi biuro</h2>
          <p>Terminarz, grupy, wyniki i drabinka są w module biura. Admin ich nie dubluje.</p>
          <a href="/office" target="_blank" rel="noopener">Otwórz biuro turnieju</a>
        </div>
      </nav>

      <main class="adm-main">
        <div class="adm-main__head">
          <h1 x-text="adminSectionTitle()"></h1>
          <span class="adm-main__hint" x-text="adminSectionHint()"></span>
          <template x-if="adminSectionTabs().length">
            <div class="adm-subtabs" role="tablist" aria-label="Widoki sekcji">
              <template x-for="item in adminSectionTabs()" :key="item.tab">
                <button
                  type="button"
                  role="tab"
                  class="adm-subtab"
                  :class="{ 'is-active': activeTab === item.tab }"
                  :aria-selected="activeTab === item.tab"
                  @click="openAdminTab(item.tab)"
                  x-text="item.label"
                ></button>
              </template>
            </div>
          </template>
        </div>

    <div x-show="activeTab === 'devices'" x-cloak id="admin-devices-list"></div>

    <div x-show="activeTab === 'panic'" x-cloak id="admin-system"></div>

    <div x-show="activeTab === 'more'" x-cloak id="admin-more"></div>

    <div x-show="activeTab === 'courts'" x-cloak>
      <div id="admin-court-pins"></div>
      <div id="admin-courts-list"></div>

      <div id="admin-director-panel"></div>
    </div>


    <!-- Tournaments Tab -->
    <div x-show="activeTab === 'tournaments'" x-cloak>
      <div x-show="editingTournamentId" class="adm-stack">
        <div id="admin-tournament-settings"></div>
        <div id="admin-tournament-extras"></div>
      </div>

      <div x-show="!editingTournamentId" id="admin-tournaments-list"></div>
      <div id="admin-tournament-create"></div>
    </div>

    <div x-show="activeTab === 'series'" x-cloak id="admin-series"></div>

    <!-- Global Players Tab -->
    <div x-show="activeTab === 'global_players'" x-cloak class="adm-stack">
      <div id="admin-players-base"></div>
      <div id="admin-players-extras"></div>
      <div id="admin-player-create"></div>
    </div>

    <div id="admin-tournament-players"></div>

    <div id="admin-overlay-panel"></div>

    <div id="admin-logo-crop"></div>

      </main>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast toast-end" x-data x-show="$store.toast?.show" x-cloak>
    <div class="alert" :class="'alert-' + ($store.toast?.type || 'info')">
      <span x-text="$store.toast?.message"></span>
    </div>
  </div>

  <div
    x-data="analyticsConsent"
    class="consent-banner"
    x-show="visible"
    x-cloak
    role="region"
    aria-labelledby="admin-consent-title"
    aria-describedby="admin-consent-body"
  >
    <div class="consent-banner__inner">
      <h2 id="admin-consent-title" class="consent-banner__title" x-text="consentText().title">Analityka odwiedzin</h2>
      <p id="admin-consent-body" class="consent-banner__body" x-text="consentText().body"></p>
      <div class="consent-banner__actions">
        <a class="consent-banner__link" :href="privacyHref()" x-text="consentText().privacyLink">Więcej w polityce prywatności</a>
        <button type="button" class="consent-banner__btn consent-banner__btn--ghost" @click="reject()" x-text="consentText().reject">Odrzuć</button>
        <button type="button" class="consent-banner__btn" @click="accept()" x-text="consentText().accept">Akceptuj</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
