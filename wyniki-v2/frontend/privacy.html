<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polityka prywatności — blindtennis.app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/blindtennis-icon-512.svg">
    <meta name="description" content="Polityka prywatności serwisu blindtennis.app i aplikacji Blind Tennis Referee.">
</head>
<body>
    <div x-data="privacyApp" x-cloak class="wrap privacy-page">
        <a href="#main" class="skip-link" x-text="uiText().skipToContent || 'Skip to main content'">Skip to main content</a>

        <header class="header">
            <div class="header-bar">
                <h1 class="header-title">
                    <a href="/" class="privacy-brand">
                        <img class="header-logo" src="/brand/blindtennis-logo-horizontal-on-dark.svg" width="360" height="96" alt="blindtennis.app - live scores">
                    </a>
                </h1>
                <div class="header-actions">
                    <label class="sr-only" for="privacyLangSelect" x-text="uiText().languageSelect || 'Wybierz jezyk'">Wybierz jezyk</label>
                    <select id="privacyLangSelect" class="lang-select" x-model="lang" @change="onLangChange()">
                        <option value="pl">Polski</option>
                        <option value="de">Deutsch</option>
                        <option value="en">English</option>
                        <option value="it">Italiano</option>
                        <option value="es">Español</option>
                        <option value="fr">Français</option>
                        <option value="lt">Lietuvių</option>
                    </select>
                    <button class="dark-mode-toggle" type="button" @click="toggleDarkMode()" :aria-label="darkMode ? (tr().darkModeTooltip?.light || 'Zmień na tryb jasny') : (tr().darkModeTooltip?.dark || 'Zmień na tryb ciemny')">
                        <span class="dark-mode-toggle__icon" aria-hidden="true" x-text="darkMode ? '☀️' : '🌙'"></span>
                    </button>
                </div>
            </div>
        </header>

        <main id="main" class="privacy-main" tabindex="-1">
            <article class="privacy-article">
                <p class="privacy-kicker" x-text="updatedText()"></p>
                <h1 x-text="legal().title">Polityka prywatności</h1>
                <p class="privacy-intro" x-text="legal().intro"></p>

                <nav class="privacy-toc" :aria-label="uiText().privacyToc || legal().tocLabel">
                    <h2 x-text="uiText().privacyToc || legal().tocLabel">Spis treści</h2>
                    <ol>
                        <template x-for="item in legal().sections" :key="lang + '-toc-' + item.id">
                            <li>
                                <a :href="'#' + item.id" x-text="item.heading"></a>
                            </li>
                        </template>
                    </ol>
                </nav>

                <template x-for="item in legal().sections" :key="lang + '-section-' + item.id">
                    <section class="privacy-section" :id="item.id">
                        <h2 x-text="item.heading"></h2>
                        <template x-for="(paragraph, index) in item.paragraphs" :key="item.id + '-p-' + index">
                            <p x-text="paragraph"></p>
                        </template>
                        <ul x-show="item.list && item.list.length">
                            <template x-for="(entry, index) in item.list" :key="item.id + '-li-' + index">
                                <li x-text="entry"></li>
                            </template>
                        </ul>
                    </section>
                </template>
            </article>
        </main>

        <footer class="vm-footer privacy-footer">
            <a href="/" class="vm-footer__legal" x-text="uiText().backToScores || 'Powrót do wyników'">Powrót do wyników</a>
            <span class="vm-footer__sep" aria-hidden="true">|</span>
            <span aria-current="page" x-text="uiText().privacyPolicy || 'Polityka prywatności'">Polityka prywatności</span>
            <span class="vm-footer__sep" aria-hidden="true">|</span>
            <span x-text="uiText().poweredBy || 'Powered by'">Powered by</span>
            <a href="https://vestmedia.pl" target="_blank" rel="noopener noreferrer" class="vm-footer__link">
                <img src="https://vestmedia.pl/wp-content/uploads/2024/12/Vest-Media-5.png"
                     alt="Vest Media" class="vm-footer__logo" loading="lazy">
            </a>
        </footer>
    </div>

    <div
        x-data="analyticsConsent"
        class="consent-banner"
        x-show="visible"
        x-cloak
        role="region"
        :aria-labelledby="'consent-title'"
        :aria-describedby="'consent-body'"
    >
        <div class="consent-banner__inner">
            <h2 id="consent-title" class="consent-banner__title" x-text="consentText().title">Cookies</h2>
            <p id="consent-body" class="consent-banner__body" x-text="consentText().body"></p>
            <div class="consent-banner__actions">
                <a class="consent-banner__link" :href="privacyHref()" x-text="consentText().privacyLink">Privacy policy</a>
                <button type="button" class="consent-banner__btn consent-banner__btn--ghost" @click="reject()" x-text="consentText().reject">Reject</button>
                <button type="button" class="consent-banner__btn" @click="accept()" x-text="consentText().accept">Accept</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/privacy.js"></script>
</body>
</html>
