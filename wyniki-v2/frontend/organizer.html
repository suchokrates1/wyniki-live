<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel organizatora — blindtennis.app</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // No session on this tab: go to the sign-in page before the panel is drawn.
    try {
      if (!sessionStorage.getItem('wyniki-organizer-token')) {
        location.replace('/organizer/login?next=' + encodeURIComponent(location.pathname + location.hash));
      }
    } catch (e) { /* storage blocked: the panel's own check sends you there */ }
  </script>
</head>
<body class="adm-body">
  <div x-data="organizerApp" class="adm-app">
    <a href="#main" class="org-skip">Przejdź do treści</a>
    <header class="adm-top">
      <span class="adm-top__brand">wyniki<span>.</span>organizator</span>
      <template x-if="current()">
        <span class="adm-top__chip" x-text="current().name"></span>
      </template>
      <div class="adm-top__spacer"></div>
      <span class="adm-top__tag" x-text="account?.email || ''"></span>
      <a class="adm-top__link" href="/" target="_blank" rel="noopener">Strona publiczna</a>
      <button type="button" class="adm-top__link org-top__button" @click="signOut()">Wyloguj</button>
    </header>

    <main class="org-main" id="main" tabindex="-1">
      <p class="adm-loading" x-show="loading" role="status">Wczytywanie…</p>
      <p class="adm-modal__error" role="alert" x-show="error" x-text="error"></p>

      <template x-if="!loading && !seriesList.length && !error">
        <section class="adm-card">
          <h1 class="adm-card__title">Brak przypisanej serii</h1>
          <p>Twoje konto nie należy jeszcze do żadnej serii. Napisz na <a class="adm-link" :href="'mailto:' + contactEmail" x-text="contactEmail"></a>.</p>
        </section>
      </template>

      <p class="org-banner" role="status" x-show="current() && readOnlySeries()">
        Abonament serii wygasł: panel działa tylko do odczytu. Aby przedłużyć, napisz na <a :href="'mailto:' + contactEmail" x-text="contactEmail"></a>.
      </p>
      <p class="org-banner" role="status" x-show="current() && endingSoonText()">
        <span x-text="endingSoonText()"></span> Aby przedłużyć, napisz na <a :href="'mailto:' + contactEmail" x-text="contactEmail"></a>.
      </p>

      <template x-if="current() && !route.tournamentId"><div><!-- @partial seriesHome --></div></template>
      <template x-if="current() && route.tournamentId"><div><!-- @partial tournament --></div></template>
    </main>
  </div>
  <script type="module" src="/src/organizer.js"></script>
</body>
</html>
