<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎾</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://stats.dawidsuchodolski.pl/script.js" data-website-id="b49919d3-6628-40cc-9213-72ec52409e28"></script>
</head>
<body class="office-body" x-data="officeApp()" x-init="init()" x-effect="applyOfficeDocumentLang()">
  <div class="office-lang-bar">
    <div class="office-lang-bar__inner">
      <label class="sr-only" for="officeLangSelect" x-text="officeUi().languageSelect"></label>
      <select id="officeLangSelect" class="lang-select" x-model="lang" @change="onLangChange()">
        <option value="pl">Polski</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="it">Italiano</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="lt">Lietuvių</option>
      </select>
    </div>
  </div>
  <div class="toast toast-top toast-end z-[80]" x-show="toast.show" x-transition.opacity x-cloak>
    <div class="alert" :class="{
      'alert-success': toast.type === 'success',
      'alert-warning': toast.type === 'warning',
      'alert-error': toast.type === 'error',
      'alert-info': toast.type === 'info'
    }">
      <span x-text="toast.message"></span>
    </div>
  </div>

  <main x-show="!isAuthenticated" x-cloak>
    <section class="office-login office-panel">
      <span class="office-chip office-chip-group" x-text="ot('login.slotChip', { slot })"></span>
      <h1 class="office-title mt-3" x-text="ot('login.title')"></h1>
      <div class="mt-6 rounded-2xl border border-white/70 bg-white/70 p-4" x-show="tournamentMeta || metaLoading" x-cloak>
        <div class="office-kicker" x-text="ot('login.tournamentAssigned')"></div>
        <div class="mt-2 text-sm text-slate-500" x-show="metaLoading && !tournamentMeta" x-text="ot('login.loadingTournament')"></div>
        <template x-if="tournamentMeta">
          <div>
            <div class="flex items-start justify-between gap-3 flex-wrap">
              <div>
                <div class="text-xl font-semibold text-slate-900" x-text="tournamentMeta.name"></div>
                <div class="mt-1 text-sm text-slate-500" x-text="(tournamentMeta.start_date || ot('login.noDate')) + (tournamentMeta.end_date ? ' - ' + tournamentMeta.end_date : '')"></div>
              </div>
              <div class="flex gap-2 flex-wrap">
                <span class="office-chip" :class="tournamentMeta.active ? 'office-chip-group' : 'office-chip-neutral'" x-text="tournamentMeta.active ? ot('login.activeTournament') : ot('login.inactivePreview')"></span>
                <span class="office-chip office-chip-knockout" x-show="tournamentMeta.is_simulation" x-text="ot('login.simulation')"></span>
              </div>
            </div>
          </div>
        </template>
      </div>
      <form class="mt-6 space-y-4" @submit.prevent="authenticate">
        <label class="form-control">
          <span class="label-text text-slate-700 font-semibold mb-2" x-text="ot('login.passwordLabel')"></span>
          <div class="relative">
            <input
              type="password"
              :type="showAuthPassword ? 'text' : 'password'"
              class="input input-bordered w-full bg-white/90 pr-12"
              x-model="authPassword"
              autocomplete="current-password"
              :placeholder="ot('login.passwordPlaceholder')"
            >
            <button
              type="button"
              class="absolute inset-y-0 right-0 z-10 flex w-11 items-center justify-center text-slate-500 hover:text-slate-800"
              @click="showAuthPassword = !showAuthPassword"
              :aria-label="showAuthPassword ? ot('login.hidePassword') : ot('login.showPassword')"
              :aria-pressed="showAuthPassword"
            >
              <svg x-show="!showAuthPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg x-show="showAuthPassword" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </label>
        <div class="text-sm text-red-700 min-h-6" x-text="authError"></div>
        <button type="submit" class="btn office-btn-primary" :class="{'btn-disabled': authLoading}">
          <span x-show="!authLoading" x-text="ot('login.enter')"></span>
          <span x-show="authLoading" x-text="ot('login.loggingIn')"></span>
        </button>
      </form>
    </section>
  </main>

  <main class="office-shell" x-show="isAuthenticated" x-cloak>
    <header class="office-topbar">
      <div class="office-topbar__brand">
        <template x-if="tournamentMeta?.logo_path">
          <img :src="tournamentMeta.logo_path" :alt="ot('hero.logoAlt')" class="office-logo">
        </template>
        <template x-if="!tournamentMeta?.logo_path">
          <div class="office-logo bg-white/70 flex items-center justify-center text-xl">🎾</div>
        </template>
        <div class="office-topbar__meta min-w-0">
          <h1 class="office-title truncate" x-text="tournamentMeta?.name || dashboard?.tournament?.name || ot('hero.defaultTitle')"></h1>
          <span class="office-chip office-chip-group w-fit" x-text="ot('login.slotChip', { slot })"></span>
        </div>
      </div>
      <div id="office-stats" class="office-topbar__stats">
        <div class="office-pill office-stat">
          <div class="office-pill__label" x-text="ot('stats.progress')"></div>
          <div class="office-pill__value" x-text="`${officeProgressPercent()}%`"></div>
        </div>
        <div class="office-pill office-stat">
          <div class="office-pill__label" x-text="ot('stats.finishedMatches')"></div>
          <div class="office-pill__value" x-text="dashboard?.progress?.finished_matches || 0"></div>
        </div>
        <div class="office-pill office-stat">
          <div class="office-pill__label" x-text="ot('stats.remaining')"></div>
          <div class="office-pill__value" x-text="dashboard?.progress?.remaining_matches || 0"></div>
        </div>
        <div class="office-pill office-stat">
          <div class="office-pill__label" x-text="ot('stats.bracket')"></div>
          <div class="office-pill__value" x-text="`${officeKnockout.finished_matches || 0}/${officeKnockout.expected_matches || 0}`"></div>
        </div>
      </div>
      <div class="office-topbar__actions">
        <label class="office-toggle">
          <input type="checkbox" :checked="notificationsEnabled" @change="toggleNotifications()">
          <span x-text="ot('hero.notifications')"></span>
        </label>
        <button type="button" class="btn btn-sm btn-outline bg-white/85" @click="testNotifications()" x-text="ot('hero.testNotification')"></button>
        <span class="text-xs text-slate-500" x-show="notificationPermission === 'denied'" x-text="ot('hero.browserBlocksNotifications')"></span>
        <button type="button" class="btn btn-sm btn-outline bg-white/80" @click="loadDashboard()" x-text="ot('hero.refresh')"></button>
        <button type="button" class="btn btn-sm office-btn-accent" @click="openAddMatchModal()" x-text="ot('hero.addResult')"></button>
        <button type="button" class="btn btn-sm btn-ghost text-slate-600" @click="logout()" x-text="ot('hero.logout')"></button>
      </div>
    </header>

    <section class="office-quick office-panel" aria-labelledby="office-quick-info-title">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <div class="office-kicker" x-text="ot('quickInfo.subtitle')"></div>
          <h2 id="office-quick-info-title" class="text-base font-semibold" x-text="ot('quickInfo.title')"></h2>
        </div>
        <p id="office-quick-info-desc" class="text-xs text-slate-500" x-text="ot('quickInfo.description')"></p>
      </div>
      <label class="sr-only" for="office-quick-info-message" x-text="ot('quickInfo.messageLabel')"></label>
      <textarea
        id="office-quick-info-message"
        class="textarea textarea-bordered w-full mt-2 bg-white/80"
        x-model="quickInfoMessage"
        @input="quickInfoDirty = true"
        :placeholder="ot('quickInfo.placeholder')"
        :aria-describedby="'office-quick-info-desc'"
        maxlength="2000"
      ></textarea>
      <div class="mt-2 flex items-center gap-3 flex-wrap">
        <label class="office-toggle" for="office-quick-info-active">
          <input type="checkbox" id="office-quick-info-active" x-model="quickInfoActive" @change="quickInfoDirty = true">
          <span x-text="ot('quickInfo.showPublic')"></span>
        </label>
        <button type="button" class="btn btn-sm office-btn-primary" @click="saveQuickInfo()" :class="{'btn-disabled': quickInfoSaving}" :aria-busy="quickInfoSaving" :aria-disabled="quickInfoSaving" x-text="ot('quickInfo.publish')"></button>
        <button type="button" class="btn btn-sm btn-outline bg-white/80" @click="hideQuickInfo()" x-show="quickInfoActive && quickInfoMessage" :class="{'btn-disabled': quickInfoSaving}" :aria-disabled="quickInfoSaving" x-text="ot('quickInfo.hide')"></button>
        <span class="text-xs text-slate-500" role="status" aria-live="polite" x-show="quickInfoUpdatedAt" x-text="ot('quickInfo.updated', { time: formatQuickInfoTime(quickInfoUpdatedAt) })"></span>
      </div>
    </section>

    <section class="office-tabs">
      <div class="flex items-center justify-between gap-4 flex-wrap w-full">
        <div class="flex items-center gap-1 flex-wrap">
          <button type="button" class="office-tab" :class="{'is-active': activeTab === 'history'}" @click="activeTab = 'history'" x-text="ot('tabs.history')"></button>
          <button type="button" class="office-tab" :class="{'is-active': activeTab === 'progress'}" @click="activeTab = 'progress'" x-text="ot('tabs.progress')"></button>
          <button type="button" class="office-tab" :class="{'is-active': activeTab === 'knockout'}" @click="activeTab = 'knockout'" x-text="ot('tabs.knockout')"></button>
          <button type="button" class="office-tab" :class="{'is-active': activeTab === 'planning'}" @click="openPlanningTab()" x-text="ot('tabs.planning')"></button>
        </div>
        <div class="text-sm text-slate-500 px-2" x-show="loading" x-text="ot('tabs.refreshing')"></div>
      </div>
    </section>

    <section class="mt-6 space-y-6" x-show="activeTab === 'planning'" x-cloak>
      <div class="office-panel rounded-[20px] p-4 md:p-5">
        <div class="office-plan-head">
          <div>
            <div class="office-kicker" x-text="ot('planning.subtitle')"></div>
            <h2 class="mt-1 text-xl font-semibold" x-text="ot('planning.title')"></h2>
            <p class="mt-2 text-sm text-slate-500" x-text="ot('planning.description')"></p>
          </div>
          <button type="button" class="btn btn-outline bg-white/80" @click="loadOfficePlanningData()" :class="{'btn-disabled': planningLoading}" x-text="ot('planning.refreshPlan')"></button>
        </div>
        <div class="mt-4 office-topbar__stats">
          <div class="office-pill office-stat">
            <div class="office-pill__label" x-text="planningHeadlineCompetitorLabel()"></div>
            <div class="office-pill__value" x-text="planningHeadlineCompetitorCount()"></div>
          </div>
          <div class="office-pill office-stat">
            <div class="office-pill__label" x-text="ot('planning.groups')"></div>
            <div class="office-pill__value" x-text="planningGroups.length"></div>
          </div>
          <div class="office-pill office-stat">
            <div class="office-pill__label" x-text="ot('planning.entries')"></div>
            <div class="office-pill__value" x-text="planningSchedule.length"></div>
          </div>
          <div class="office-pill office-stat">
            <div class="office-pill__label" x-text="ot('planning.courts')"></div>
            <div class="office-pill__value" x-text="planningCourts.length"></div>
          </div>
        </div>
      </div>

      <div class="office-panel rounded-[20px] p-5 md:p-6">
        <div class="flex items-start justify-between gap-4 flex-wrap cursor-pointer" @click="planningStep1Collapsed = !planningStep1Collapsed">
          <div class="flex items-start gap-3">
            <span class="mt-1 text-slate-400 transition-transform" :class="planningStep1Collapsed ? '' : 'rotate-90'">▶</span>
            <div>
              <div class="office-kicker" x-text="ot('planning.step1')"></div>
              <h3 class="mt-1 text-xl font-semibold" x-text="ot('planning.step1Title')"></h3>
              <p class="mt-1 text-sm text-slate-500" x-show="!planningStep1Collapsed" x-text="planningSelectedCategoryIsDoubles() ? ot('planning.step1OpenDoubles') : ot('planning.step1Open')"></p>
              <p class="mt-1 text-sm text-emerald-700 font-semibold" x-show="planningStep1Collapsed && planningGroupsComplete()" x-text="planningStep1CompleteLine()"></p>
              <p class="mt-1 text-sm text-amber-700 font-semibold" x-show="planningStep1Collapsed && !planningGroupsComplete()" x-text="ot('planning.step1InProgress')"></p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 text-sm font-semibold text-emerald-600" x-show="planningSaving">
              <span class="loading loading-spinner loading-sm"></span> <span x-text="ot('planning.saving')"></span>
            </div>
            <span class="btn btn-sm btn-ghost" x-text="planningStep1Collapsed ? ot('planning.edit') : ot('planning.collapse')"></span>
          </div>
        </div>

        <div x-show="!planningStep1Collapsed">
        <div class="mt-5 rounded-[16px] border border-emerald-200 bg-emerald-50/60 p-4" x-show="!tournamentCategories.length || categorySetupOpen">
          <div class="office-kicker" x-text="ot('planning.categoriesSetup')"></div>
          <p class="mt-1 text-sm text-slate-600" x-text="ot('planning.categoriesSetupHint')"></p>
          <div class="mt-3 flex flex-wrap gap-2">
            <template x-for="preset in planningCategoryPresetKeys()" :key="'preset_'+preset">
              <label class="inline-flex flex-col gap-1 rounded-2xl border border-slate-200 bg-white/90 px-3 py-2 text-sm cursor-pointer">
                <span class="inline-flex items-center gap-2">
                  <input type="checkbox" class="checkbox checkbox-sm checkbox-primary" x-model="categoryPresetSelected[preset]">
                  <span x-text="planningCategoryPresetLabel(preset)"></span>
                </span>
                <span class="inline-flex items-center gap-1 text-[11px] text-slate-500 pl-7">
                  <input type="checkbox" class="checkbox checkbox-xs" x-model="categoryPresetDoubles[preset]" :disabled="!categoryPresetSelected[preset]">
                  <span x-text="ot('planning.doubles')"></span>
                </span>
              </label>
            </template>
          </div>
          <div class="mt-3 grid gap-2 sm:grid-cols-3">
            <input type="text" class="input input-bordered bg-white/90 sm:col-span-2" :placeholder="ot('planning.customCategoryPlaceholder')" x-model="categoryCustomLabel">
            <input type="text" class="input input-bordered bg-white/90" placeholder="B2 / B3,B4" x-model="categoryCustomHints">
          </div>
          <label class="mt-2 inline-flex items-center gap-2 text-sm text-slate-600">
            <input type="checkbox" class="checkbox checkbox-sm" x-model="categoryCustomDoubles">
            <span x-text="ot('planning.doubles')"></span>
          </label>
          <p class="mt-1 text-xs text-slate-500" x-text="ot('planning.doublesHint')"></p>
          <div class="mt-3 flex gap-2 flex-wrap">
            <button type="button" class="btn office-btn-primary" @click="confirmTournamentCategories()" x-text="ot('planning.confirmCategories')"></button>
            <button type="button" class="btn btn-outline bg-white/80" x-show="tournamentCategories.length" @click="categorySetupOpen = false" x-text="ot('planning.cancelSetup')"></button>
          </div>
        </div>

        <div class="mt-5 rounded-[16px] border border-slate-200/80 bg-white/65 p-4" x-show="tournamentCategories.length && !categorySetupOpen">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="office-kicker" x-text="ot('planning.tournamentCategories')"></div>
            <button type="button" class="text-sm font-semibold text-emerald-700" @click="categorySetupOpen = true" x-text="'+ ' + ot('planning.addCategory')"></button>
          </div>
          <div class="mt-2 flex flex-wrap gap-2">
            <template x-for="cat in tournamentCategories.filter(c => c.is_active !== 0)" :key="'tcat_'+cat.id">
              <div class="rounded-xl border border-slate-200 bg-white/90 px-3 py-2 text-sm flex items-center gap-2">
                <span class="font-semibold" x-text="cat.label"></span>
                <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-emerald-800" x-show="cat.is_doubles" x-text="ot('planning.doubles')"></span>
                <button type="button" class="text-emerald-700 text-xs" @click="startCategoryEdit(cat)" x-text="ot('planning.edit')"></button>
                <button type="button" class="text-rose-600 text-xs" @click="deleteTournamentCategory(cat.id)" x-text="ot('planning.delete')"></button>
              </div>
            </template>
          </div>
          <div class="mt-3 grid gap-2 sm:grid-cols-3" x-show="categoryEditId">
            <input type="text" class="input input-bordered bg-white/90 sm:col-span-2" x-model="categoryEditLabel">
            <button type="button" class="btn btn-sm office-btn-primary" @click="saveTournamentCategoryEdit()" x-text="ot('planning.save')"></button>
          </div>
          <div class="mt-3 grid gap-2 sm:grid-cols-4" x-show="categorySetupOpen && tournamentCategories.length">
            <input type="text" class="input input-bordered bg-white/90 sm:col-span-2" :placeholder="ot('planning.customCategoryPlaceholder')" x-model="categoryCustomLabel">
            <input type="text" class="input input-bordered bg-white/90" placeholder="B2" x-model="categoryCustomHints">
            <button type="button" class="btn btn-outline" @click="addCustomTournamentCategory()" x-text="ot('planning.addCategory')"></button>
          </div>
          <label class="mt-2 inline-flex items-center gap-2 text-sm text-slate-600" x-show="categorySetupOpen && tournamentCategories.length">
            <input type="checkbox" class="checkbox checkbox-sm" x-model="categoryCustomDoubles">
            <span x-text="ot('planning.doubles')"></span>
          </label>
        </div>

        <div class="mt-5 rounded-[16px] border border-slate-200/80 bg-white/65 p-4" x-show="tournamentCategories.length && !categorySetupOpen">
          <button type="button" class="text-sm font-semibold text-emerald-700" @click="planningAddPlayerOpen = !planningAddPlayerOpen" x-text="planningAddPlayerOpen ? '− ' + ot('planning.addPlayerTitle') : '+ ' + ot('planning.addPlayer')"></button>
          <div class="mt-3 grid gap-3 sm:grid-cols-2 lg:grid-cols-6" x-show="planningAddPlayerOpen">
            <input type="text" class="input input-bordered bg-white/90" :placeholder="ot('planning.firstName')" x-model="planningNewPlayer.first_name">
            <input type="text" class="input input-bordered bg-white/90" :placeholder="ot('planning.lastName')" x-model="planningNewPlayer.last_name">
            <select class="select select-bordered bg-white/90" x-model="planningNewPlayer.category">
              <option value="B1">B1</option><option value="B2">B2</option><option value="B3">B3</option><option value="B4">B4</option>
            </select>
            <select class="select select-bordered bg-white/90" x-model="planningNewPlayer.gender">
              <option value="" x-text="ot('planning.genderOptional')"></option>
              <option value="M" x-text="ot('gender.men')"></option>
              <option value="K" x-text="ot('gender.women')"></option>
            </select>
            <input type="text" class="input input-bordered bg-white/90" maxlength="2" :placeholder="ot('planning.countryCode')" x-model="planningNewPlayer.country">
            <button type="button" class="btn office-btn-primary" @click="addOfficePlayer()" x-text="ot('planning.addPlayer')"></button>
          </div>
        </div>
        <div class="mt-5 rounded-[16px] border border-slate-200/80 bg-white/65 p-4" x-show="planningSelectedCategoryIsDoubles() && tournamentCategories.length && !categorySetupOpen">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <button type="button" class="text-sm font-semibold text-emerald-700" @click="planningAddTeamOpen = !planningAddTeamOpen" x-text="planningAddTeamOpen ? '− ' + ot('planning.addTeamTitle') : '+ ' + ot('planning.addTeam')"></button>
            <div class="inline-flex rounded-lg border border-slate-200 overflow-hidden text-[11px] font-semibold" role="group">
              <button type="button"
                class="px-2.5 py-1"
                :class="planningCategoryFilterEnabled ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'"
                @click="planningCategoryFilterEnabled = true"
                x-text="ot('planning.poolFilter')"></button>
              <button type="button"
                class="px-2.5 py-1"
                :class="!planningCategoryFilterEnabled ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'"
                @click="planningCategoryFilterEnabled = false"
                x-text="ot('planning.poolFilterAll')"></button>
            </div>
          </div>
          <p class="mt-1 text-xs text-slate-500" x-text="ot('planning.doublesPartnerHint')"></p>
          <div class="mt-3 grid gap-3 sm:grid-cols-3" x-show="planningAddTeamOpen">
            <select class="select select-bordered bg-white/90" x-model="planningNewTeam.player1_id">
              <option value="" x-text="ot('planning.partner1')"></option>
              <template x-for="player in planningTeamPartnerOptions(planningNewTeam.player2_id)" :key="'office_team_p1_'+player.id">
                <option :value="player.id" x-text="planningTeamPartnerLabel(player)"></option>
              </template>
            </select>
            <select class="select select-bordered bg-white/90" x-model="planningNewTeam.player2_id">
              <option value="" x-text="ot('planning.partner2')"></option>
              <template x-for="player in planningTeamPartnerOptions(planningNewTeam.player1_id)" :key="'office_team_p2_'+player.id">

                    <span class="hm-winner-mark hm-winner-mark--empty" x-show="officeMatchWinner(match) !== 'A'" aria-hidden="true"></span>

                      <template x-for="(set, i) in officeMatchSets(match)" :key="'oa-'+match.id+'-'+i">

                          <span x-text="set.a"></span><sup class="hm-tb" x-show="set.tb !== null && !set.isSuperTB && set.a < set.b" x-text="set.tb"></sup>

                  </div>
                  <div class="hm-player" :class="{ 'hm-player--winner': officeMatchWinner(match) === 'B' }">
                    <span class="hm-winner-mark" x-show="officeMatchWinner(match) === 'B'" aria-hidden="true"></span>
                    <span class="hm-winner-mark hm-winner-mark--empty" x-show="officeMatchWinner(match) !== 'B'" aria-hidden="true"></span>
                    <span class="hm-player-name competitor-name" x-text="formatCompetitorName(match.player2_name || '-')"></span>
                    <span class="hm-sets">
                      <template x-for="(set, i) in officeMatchSets(match)" :key="'ob-'+match.id+'-'+i">
                        <span class="hm-set-cell" :class="{ 'hm-set-cell--won': set.b > set.a }">
                          <span x-text="set.b"></span><sup class="hm-tb" x-show="set.tb !== null && !set.isSuperTB && set.b < set.a" x-text="set.tb"></sup>

      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="office-kicker" x-text="ot('modals.correction')"></div>
          <h2 class="mt-2 text-xl font-semibold" x-text="ot('modals.editMatchTitle')"></h2>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" @click="closeEditModal()" x-text="ot('modals.close')"></button>
      </div>

      <template x-if="officeEditingMatch">
        <div class="mt-6 space-y-6">
          <div class="grid gap-4 md:grid-cols-2">
            <div class="rounded-2xl border border-slate-200/80 bg-white/70 p-4">
              <div class="office-kicker" x-text="officeCompetitorALabel(officeEditingMatch)"></div>
              <div class="mt-2 text-xl font-semibold competitor-name" x-text="formatCompetitorName(officeEditingMatch.player1_name)"></div>
            </div>
            <div class="rounded-2xl border border-slate-200/80 bg-white/70 p-4">
              <div class="office-kicker" x-text="officeCompetitorBLabel(officeEditingMatch)"></div>
              <div class="mt-2 text-xl font-semibold competitor-name" x-text="formatCompetitorName(officeEditingMatch.player2_name)"></div>
            </div>
          </div>

          <div class="office-match-grid">
            <div class="rounded-2xl border border-slate-200/80 bg-white/70 p-4">
              <div class="text-sm font-semibold mb-3" x-text="ot('modals.set1')"></div>
              <div class="grid grid-cols-2 gap-3">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.set1_p1">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.set1_p2">
              </div>
            </div>
            <div class="rounded-2xl border border-slate-200/80 bg-white/70 p-4">
              <div class="text-sm font-semibold mb-3" x-text="ot('modals.set2')"></div>
              <div class="grid grid-cols-2 gap-3">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.set2_p1">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.set2_p2">
              </div>
            </div>
            <div class="rounded-2xl border border-slate-200/80 bg-white/70 p-4 md:col-span-2">
              <div class="text-sm font-semibold mb-3" x-text="ot('modals.superTiebreak')"></div>
              <div class="grid grid-cols-2 gap-3">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.stb_p1">
                <input type="number" min="0" class="input input-bordered bg-white/90" x-model="officeEditingMatch.stb_p2">
              </div>
            </div>
          </div>
        </div>
      </template>

      <div class="mt-8 flex justify-end gap-3">
        <button type="button" class="btn btn-ghost" @click="closeEditModal()" x-text="ot('modals.cancel')"></button>
        <button type="button" class="btn office-btn-accent" @click="saveOfficeMatchEdit()" x-text="ot('modals.saveCorrection')"></button>
      </div>
    </section>
  </div>

  <script type="module" src="/src/office.js"></script>
</body>
</html>
