<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sędzia">
  <title>Blind Tennis Referee</title>
  <link rel="manifest" href="/umpire.webmanifest">
  <link rel="apple-touch-icon" href="/umpire-icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎾</text></svg>">
</head>
<body>
  <div class="ump" x-data="umpireApp()" x-init="init()">
    <header class="ump-top">
      <button
        class="ump-icon-btn"
        type="button"
        x-show="screen !== 'language'"
        :aria-label="t('back')"
        @click="back()"
      >‹</button>
      <span class="ump-icon-btn ump-icon-btn--spacer" x-show="screen === 'language'" aria-hidden="true"></span>
      <div class="ump-top__title">
        <p class="ump-sub" x-text="t('appName')"></p>
        <h1 class="ump-title" x-text="screenTitle()"></h1>
        <p class="ump-sub" x-show="screen === 'match' && chrome().showTimer" x-text="timerText"></p>
        <p class="ump-sub" x-show="screen === 'match' && syncLabel()" x-text="syncLabel()"></p>
      </div>
      <div class="ump-top__actions">
        <button class="ump-btn ump-btn--ghost" type="button" x-show="screen === 'match' && chrome().showUndo" :disabled="!chrome().undoEnabled" @click="askUndo()" x-text="t('undo')"></button>
        <button class="ump-btn ump-btn--ghost" type="button" x-show="screen === 'match' && chrome().showFinish" @click="askFinish()" x-text="t('finish')"></button>
        <button
          class="ump-icon-btn"
          type="button"
          x-show="screen === 'court'"
          :aria-label="t('settings')"
          @click="openSettings()"
        >⚙</button>
      </div>
    </header>

    <p class="ump-toast" x-show="directorToast" x-text="t('directorUpdated')"></p>
    <p class="ump-error" x-show="error" x-text="error"></p>
    <p x-show="loading" x-text="t('loading')"></p>

    <section x-show="screen === 'language'">
      <div class="ump-list">
        <template x-for="item in languages" :key="item.code">
          <button type="button" class="ump-btn ump-lang ump-card" @click="selectLanguage(item.code)">
            <span x-text="item.flag + '  ' + item.name"></span>
          </button>
        </template>
      </div>
    </section>

    <section x-show="screen === 'tournament'">
      <button class="ump-btn" type="button" @click="loadTournaments()" x-text="t('refresh')"></button>
      <p x-show="!loading && !tournaments.length" x-text="t('emptyTournaments')"></p>
      <div class="ump-list" style="margin-top:12px">
        <template x-for="tournament in tournaments" :key="tournament.id">
          <button type="button" class="ump-btn ump-lang ump-card" @click="selectTournament(tournament)">
            <span x-text="tournament.name"></span>
          </button>
        </template>
      </div>
    </section>

    <section x-show="screen === 'court'">
      <button class="ump-btn" type="button" @click="loadCourts()" x-text="t('refresh')"></button>
      <p x-show="!loading && !courts.length" x-text="t('emptyCourts')"></p>
      <div class="ump-courts" style="margin-top:12px">
        <template x-for="court in courts" :key="court.kort_id">
          <button type="button" class="ump-btn ump-court ump-card" @click="openPin(court)">
            <span x-text="court.name"></span>
            <span class="ump-badge" x-show="court.is_available === false" x-text="t('occupied')"></span>
          </button>
        </template>
      </div>
    </section>

    <section x-show="screen === 'players'">
      <div class="ump-card ump-suggest" x-show="suggestion">
        <strong x-text="t('suggestion')"></strong>
        <p x-text="(suggestion && suggestion.player1_name || '') + ' vs ' + (suggestion && suggestion.player2_name || '')"></p>
        <button class="ump-btn ump-btn--accent" type="button" @click="applySuggestion()" x-text="t('applySuggestion')"></button>
      </div>
      <div class="ump-toggle">
        <button class="ump-btn" type="button" :aria-pressed="!isDoubles" @click="isDoubles = false; selectedIds = selectedIds.slice(0, 2)" x-text="t('singles')"></button>
        <button class="ump-btn" type="button" :aria-pressed="isDoubles" @click="isDoubles = true" x-text="t('doubles')"></button>
      </div>
      <input class="ump-search" type="search" :placeholder="t('searchPlayers')" x-model="search">
      <div class="ump-list" style="margin-top:12px">
        <template x-for="player in filteredPlayers()" :key="player.id">
          <button type="button" class="ump-btn ump-player ump-card" :class="{ 'is-on': isSelected(player) }" @click="togglePlayer(player)">
            <span x-text="(isSelected(player) ? (selectionIndex(player) + 1) + '. ' : '') + (player.name || player.full_name)"></span>
          </button>
        </template>
      </div>
      <p x-show="!canContinuePlayers()" x-text="t('needPlayers', { count: isDoubles ? 4 : 2 })"></p>
      <div class="ump-toggle">
        <button class="ump-btn" type="button" @click="showAddPlayer = !showAddPlayer" x-text="t('addPlayer')"></button>
        <button class="ump-btn ump-btn--accent" type="button" :disabled="!canContinuePlayers()" @click="openConfig()" x-text="t('next')"></button>
      </div>
      <div class="ump-card" style="padding:14px;margin-top:12px" x-show="showAddPlayer">
        <input class="ump-input" :placeholder="t('firstName')" x-model="addForm.firstName">
        <input class="ump-input" style="margin-top:8px" :placeholder="t('lastName')" x-model="addForm.lastName">
        <input class="ump-input" style="margin-top:8px" :placeholder="t('country')" x-model="addForm.country">
        <input class="ump-input" style="margin-top:8px" placeholder="B1" x-model="addForm.category">
        <button class="ump-btn ump-btn--accent" style="margin-top:8px" type="button" @click="saveNewPlayer()" x-text="t('savePlayer')"></button>
      </div>
    </section>

    <section x-show="screen === 'config'">
      <label class="ump-sub" x-text="t('umpireName')"></label>
      <input class="ump-input" x-model="configForm.umpireName">
      <label class="ump-sub" x-text="t('manualTime')"></label>
      <input class="ump-input" type="datetime-local" x-model="configForm.manualStartTime">
      <label class="ump-toggle"><input type="checkbox" x-model="configForm.noAdvantage"> <span x-text="t('noAdvantage')"></span></label>
      <label class="ump-toggle"><input type="checkbox" x-model="configForm.tiebreakOnly"> <span x-text="t('tiebreakOnly')"></span></label>
      <div x-show="!configForm.tiebreakOnly">
        <p class="ump-sub" x-text="t('gamesPerSet')"></p>
        <div class="ump-chips">
          <template x-for="value in [3,4,5,6]" :key="'g'+value">
            <button type="button" class="ump-btn" :aria-pressed="configForm.gamesPerSet === value" @click="configForm.gamesPerSet = value" x-text="value"></button>
          </template>
        </div>
        <p class="ump-sub" x-text="t('setsToWin')"></p>
        <div class="ump-chips">
          <template x-for="value in [1,2,3]" :key="'s'+value">
            <button type="button" class="ump-btn" :aria-pressed="configForm.setsToWin === value" @click="configForm.setsToWin = value" x-text="value"></button>
          </template>
        </div>
        <p class="ump-sub" x-text="t('tiebreak')"></p>
        <div class="ump-chips">
          <button type="button" class="ump-btn" :aria-pressed="configForm.tiebreakPoints === 7" @click="configForm.tiebreakPoints = 7">7</button>
          <button type="button" class="ump-btn" :aria-pressed="configForm.tiebreakPoints === 10" @click="configForm.tiebreakPoints = 10">10</button>
        </div>
        <p class="ump-sub" x-text="t('superTiebreak')"></p>
        <div class="ump-chips">
          <button type="button" class="ump-btn" :aria-pressed="configForm.superTiebreakPoints === 7" @click="configForm.superTiebreakPoints = 7">7</button>
          <button type="button" class="ump-btn" :aria-pressed="configForm.superTiebreakPoints === 10" @click="configForm.superTiebreakPoints = 10">10</button>
        </div>
      </div>
      <div x-show="configForm.tiebreakOnly">
        <p class="ump-sub" x-text="t('tiebreak')"></p>
        <div class="ump-chips">
          <button type="button" class="ump-btn" :aria-pressed="configForm.tbOnlyPoints === 7" @click="configForm.tbOnlyPoints = 7">7</button>
          <button type="button" class="ump-btn" :aria-pressed="configForm.tbOnlyPoints === 10" @click="configForm.tbOnlyPoints = 10">10</button>
        </div>
      </div>
      <div class="ump-modes">
        <button type="button" class="ump-card ump-mode" @click="startWithMode('BASIC')">
          <h2 x-text="t('basic')"></h2>
          <p class="ump-sub" x-text="t('basicHint')"></p>
        </button>
        <button type="button" class="ump-card ump-mode" @click="startWithMode('ADVANCED')">
          <h2 x-text="t('advanced')"></h2>
          <p class="ump-sub" x-text="t('advancedHint')"></p>
        </button>
      </div>
    </section>

    <template x-if="screen === 'match' && matchRev >= 0">
    <section class="ump-match">
      <div class="ump-board" x-show="chrome().showScoreboard && scoreboard()">
        <p class="ump-board__meta">
          <span x-text="scoreboard() && t(scoreboard().matchType === 'mixed' ? 'matchTypeMixed' : scoreboard().matchType === 'doubles' ? 'matchTypeDoubles' : 'matchTypeSingles')"></span>
          <span x-show="scoreboard() && scoreboard().umpireName" x-text="scoreboard() && t('umpireMeta', { name: scoreboard().umpireName })"></span>
        </p>
        <div class="ump-board__grid">
          <span class="ump-board__h ump-board__h-player" x-text="t('scoreboardPlayer')"></span>
          <span class="ump-board__h" aria-hidden="true"></span>
          <span class="ump-board__h" x-text="t('scoreboardPoints')"></span>
          <span class="ump-board__h" x-text="t('scoreboardSet1')"></span>
          <span class="ump-board__h" x-text="t('scoreboardSet2')"></span>

          <span class="ump-board__player">
            <span class="ump-board__flag" x-text="scoreboard() && scoreboard().p1Flag"></span>
            <span class="ump-board__name" x-text="scoreboard() && scoreboard().p1Name"></span>
          </span>
          <span class="ump-board__serve" :class="{ 'is-on': scoreboard() && scoreboard().p1Serving }">🎾</span>
          <span class="ump-board__pts" x-text="scoreboard() && scoreboard().p1Points"></span>
          <span class="ump-board__set" :class="{ 'is-on': scoreboard() && scoreboard().set1.active }" x-text="scoreboard() && scoreboard().set1.p1"></span>
          <span class="ump-board__set" :class="{ 'is-on': scoreboard() && scoreboard().set2.active }" x-text="scoreboard() && scoreboard().set2.p1"></span>

          <span class="ump-board__player">
            <span class="ump-board__flag" x-text="scoreboard() && scoreboard().p2Flag"></span>
            <span class="ump-board__name" x-text="scoreboard() && scoreboard().p2Name"></span>
          </span>
          <span class="ump-board__serve" :class="{ 'is-on': scoreboard() && scoreboard().p2Serving }">🎾</span>
          <span class="ump-board__pts" x-text="scoreboard() && scoreboard().p2Points"></span>
          <span class="ump-board__set" :class="{ 'is-on': scoreboard() && scoreboard().set1.active }" x-text="scoreboard() && scoreboard().set1.p2"></span>
          <span class="ump-board__set" :class="{ 'is-on': scoreboard() && scoreboard().set2.active }" x-text="scoreboard() && scoreboard().set2.p2"></span>
        </div>
        <p class="ump-board__mode" x-show="scoreboard() && scoreboard().gameMode" x-text="gameModeLabel()"></p>
      </div>

      <div x-show="matchView() === 'SERVER_SELECTION'">
        <button class="ump-btn" type="button" @click="swapSides()" x-text="t('swapSides')"></button>
        <div class="ump-serve-grid" style="margin-top:12px">
          <template x-for="button in serverButtons()" :key="button.buttonIndex">
            <button type="button" class="ump-btn ump-card ump-serve-btn" :class="{ 'is-on': button.selected, 'is-team1': button.colorRole === 'Team1', 'is-team2': button.colorRole === 'Team2' }" @click="chooseServer(button.buttonIndex)" x-text="button.label"></button>
          </template>
        </div>
      </div>

      <div class="ump-adv" x-show="matchView() === 'SERVE' && advancedServe()">
        <p class="ump-basic__info" :class="{ 'is-second': advancedServe() && !advancedServe().isFirstServe }" x-text="advancedServe() && t(advancedServe().serveInfoKey)"></p>
        <div class="ump-basic__court">
          <div class="ump-basic__side">
            <p class="ump-basic__name" x-text="advancedServe() && advancedServe().leftName"></p>
            <template x-if="advancedServe() && advancedServe().showServeLeft">
              <div class="ump-adv__stack">
                <button class="ump-btn ump-adv__ace" type="button" @click="ace()" x-text="t('ace')"></button>
                <button class="ump-btn ump-adv__fault" type="button" @click="fault()" x-text="t('fault')"></button>
                <button class="ump-btn ump-adv__foot" type="button" @click="footFault()" x-text="t('footFault')"></button>
              </div>
            </template>
          </div>
          <div class="ump-basic__side">
            <p class="ump-basic__name" x-text="advancedServe() && advancedServe().rightName"></p>
            <template x-if="advancedServe() && advancedServe().showServeRight">
              <div class="ump-adv__stack">
                <button class="ump-btn ump-adv__ace" type="button" @click="ace()" x-text="t('ace')"></button>
                <button class="ump-btn ump-adv__fault" type="button" @click="fault()" x-text="t('fault')"></button>
                <button class="ump-btn ump-adv__foot" type="button" @click="footFault()" x-text="t('footFault')"></button>
              </div>
            </template>
          </div>
        </div>
        <button class="ump-btn ump-btn--accent ump-adv__bip" type="button" @click="ballInPlay()" x-text="t('ballInPlay')"></button>
      </div>

      <div class="ump-adv" x-show="matchView() === 'RALLY' && advancedRally()">
        <div class="ump-basic__court">
          <div class="ump-basic__side">
            <p class="ump-basic__name" x-text="advancedRally() && advancedRally().leftName"></p>
            <button class="ump-btn ump-adv__ace" type="button" @click="winner(advancedRally().leftIsPlayer1)" x-text="t('winner')"></button>
            <button class="ump-btn ump-adv__forced" type="button" @click="forcedError(advancedRally().leftIsPlayer1)" x-text="t('forcedError')"></button>
            <button class="ump-btn ump-adv__fault" type="button" @click="unforcedError(advancedRally().leftIsPlayer1)" x-text="t('unforcedError')"></button>
          </div>
          <div class="ump-basic__side">
            <p class="ump-basic__name" x-text="advancedRally() && advancedRally().rightName"></p>
            <button class="ump-btn ump-adv__ace" type="button" @click="winner(advancedRally().rightIsPlayer1)" x-text="t('winner')"></button>
            <button class="ump-btn ump-adv__forced" type="button" @click="forcedError(advancedRally().rightIsPlayer1)" x-text="t('forcedError')"></button>
            <button class="ump-btn ump-adv__fault" type="button" @click="unforcedError(advancedRally().rightIsPlayer1)" x-text="t('unforcedError')"></button>
          </div>
        </div>
      </div>

      <div class="ump-basic" x-show="matchView() === 'BASIC_SCORING' && basicView()">
        <p class="ump-basic__info" :class="{ 'is-second': basicView() && basicView().faultKind === 'double' }" x-text="basicView() && t(basicView().serveInfoKey)"></p>
        <div class="ump-basic__court">
          <div class="ump-basic__col">
            <p class="ump-basic__name" x-text="basicView() && basicView().leftName"></p>
            <div class="ump-basic__side ump-basic__side--server" x-show="basicView() && basicView().showServerLeft">
              <button class="ump-btn ump-win" type="button" @click="basicWin(basicView().leftIsPlayer1)" x-text="t('win')"></button>
              <button class="ump-btn ump-fault" type="button" :class="basicView() && basicView().faultKind === 'double' ? 'ump-fault--df' : 'ump-fault--second'" @click="basicFault()" x-text="basicView() && t(basicView().faultKind === 'double' ? 'doubleFaultButton' : 'secondServeButton')"></button>
            </div>
            <div class="ump-basic__side ump-basic__side--receiver" x-show="basicView() && basicView().showReceiverLeft">
              <button class="ump-btn ump-win" type="button" @click="basicWin(basicView().leftIsPlayer1)" x-text="t('win')"></button>
            </div>
          </div>
          <div class="ump-basic__col">
            <p class="ump-basic__name" x-text="basicView() && basicView().rightName"></p>
            <div class="ump-basic__side ump-basic__side--server" x-show="basicView() && basicView().showServerRight">
              <button class="ump-btn ump-win" type="button" @click="basicWin(basicView().rightIsPlayer1)" x-text="t('win')"></button>
              <button class="ump-btn ump-fault" type="button" :class="basicView() && basicView().faultKind === 'double' ? 'ump-fault--df' : 'ump-fault--second'" @click="basicFault()" x-text="basicView() && t(basicView().faultKind === 'double' ? 'doubleFaultButton' : 'secondServeButton')"></button>
            </div>
            <div class="ump-basic__side ump-basic__side--receiver" x-show="basicView() && basicView().showReceiverRight">
              <button class="ump-btn ump-win" type="button" @click="basicWin(basicView().rightIsPlayer1)" x-text="t('win')"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="ump-card ump-announce" x-show="matchView() === 'ANNOUNCEMENT' && announcement()">
        <p class="ump-announce__icon" x-text="announcement() && announcement().icon"></p>
        <h2 x-text="announcement() && announcement().title"></h2>
        <p x-text="announcement() && announcement().message"></p>
        <button class="ump-btn ump-btn--accent" type="button" @click="continueAnnouncement()" x-text="t('continue')"></button>
        <button class="ump-btn" type="button" x-show="announcement() && announcement().showSkipSides" @click="skipSideChange()" x-text="t('skipSides')"></button>
      </div>

      <div class="ump-card ump-finish" x-show="matchView() === 'MATCH_FINISHED' && matchState()">
        <h2 x-text="t('matchFinished')"></h2>
        <p class="ump-finish__winner" x-text="t('winnerLabel', { name: winnerName() })"></p>
        <dl class="ump-stats">
          <div><dt x-text="t('aces')"></dt><dd x-text="statsLine('aces')"></dd></div>
          <div><dt x-text="t('doubleFaults')"></dt><dd x-text="statsLine('doubleFaults')"></dd></div>
          <div><dt x-text="t('winnersStat')"></dt><dd x-text="statsLine('winners')"></dd></div>
          <div><dt x-text="t('unforcedErrors')"></dt><dd x-text="statsLine('unforcedErrors')"></dd></div>
          <div><dt x-text="t('firstServePct')"></dt><dd x-text="servePctLine()"></dd></div>
        </dl>
        <button class="ump-btn ump-btn--accent" type="button" @click="nextMatch(true)" x-text="t('nextSame')"></button>
        <button class="ump-btn" type="button" @click="nextMatch(false)" x-text="t('nextNew')"></button>
      </div>
    </section>
    </template>

    <section x-show="screen === 'settings'" class="ump-settings">
      <h2 class="ump-section-title" x-text="t('settingsLanguage')"></h2>
      <div class="ump-list">
        <template x-for="item in languages" :key="'set-lang-' + item.code">
          <button
            type="button"
            class="ump-btn ump-lang ump-card"
            :class="{ 'ump-btn--accent': lang === item.code }"
            @click="selectLanguage(item.code)"
          >
            <span x-text="item.flag + '  ' + item.name"></span>
          </button>
        </template>
      </div>

      <h2 class="ump-section-title" x-text="t('appearance')"></h2>
      <p class="ump-sub" x-text="t('theme')"></p>
      <div class="ump-toggle">
        <template x-for="item in themes" :key="item">
          <button
            type="button"
            class="ump-btn"
            :class="{ 'ump-btn--accent': theme === item }"
            @click="setTheme(item)"
            x-text="themeLabel(item)"
          ></button>
        </template>
      </div>

      <button
        class="ump-btn ump-btn--accent"
        type="button"
        x-show="canInstall && !installed"
        @click="installApp()"
        x-text="t('installApp')"
      ></button>
      <p class="ump-sub" x-show="installed" x-text="t('installed')"></p>

      <h2 class="ump-section-title" x-text="t('matchHistory')"></h2>
      <button class="ump-btn ump-btn--accent" type="button" @click="openHistory()" x-text="t('matchHistory')"></button>

      <h2 class="ump-section-title" x-text="t('diagnostics')"></h2>
      <dl class="ump-stats">
        <template x-for="row in diagnosticsRows()" :key="row.label">
          <div>
            <dt x-text="row.label"></dt>
            <dd x-text="row.value"></dd>
          </div>
        </template>
      </dl>
      <button class="ump-btn" type="button" @click="copyDiagnostics()" x-text="t('diagnosticsCopy')"></button>
      <p class="ump-sub" x-show="diagnosticsCopyOk" x-text="t('diagnosticsCopied')"></p>
    </section>

    <section x-show="screen === 'history'">
      <p x-show="!historyEntries.length" x-text="t('historyEmpty')"></p>
      <button
        class="ump-btn"
        type="button"
        x-show="historyEntries.length"
        @click="askDeleteAllHistory()"
        x-text="t('deleteAll')"
      ></button>
      <div class="ump-list" style="margin-top:12px">
        <template x-for="entry in historyEntries" :key="entry.clientMatchUuid">
          <article class="ump-card ump-history">
            <button type="button" class="ump-history__main" @click="openHistoryDetail(entry)">
              <strong x-text="entry.player1Name + ' vs ' + entry.player2Name"></strong>
              <span x-text="historyScore(entry)"></span>
              <span class="ump-sub" x-text="historyWhen(entry)"></span>
              <span class="ump-sub" x-text="(entry.courtName || '') + ' · ' + historyDuration(entry)"></span>
              <span class="ump-sub" x-show="entry.winnerName" x-text="t('winnerLabel', { name: entry.winnerName })"></span>
            </button>
            <button type="button" class="ump-btn ump-btn--ghost ump-history__delete" @click="askDeleteHistory(entry)">✕</button>
          </article>
        </template>
      </div>
    </section>

    <section x-show="screen === 'historyDetail' && historyDetail" class="ump-settings">
      <h2 x-text="historyDetail && (historyDetail.player1Name + ' vs ' + historyDetail.player2Name)"></h2>
      <p class="ump-finish__winner" x-text="historyDetail && historyScore(historyDetail)"></p>
      <dl class="ump-stats">
        <div><dt x-text="t('courtLabel')"></dt><dd x-text="historyDetail && historyDetail.courtName"></dd></div>
        <div><dt x-text="t('duration')"></dt><dd x-text="historyDetail && historyDuration(historyDetail)"></dd></div>
        <div><dt x-text="t('umpireName')"></dt><dd x-text="historyDetail && historyDetail.umpireName"></dd></div>
        <div x-show="historyDetail && historyDetail.winnerName">
          <dt x-text="t('finish')"></dt>
          <dd x-text="historyDetail && t('winnerLabel', { name: historyDetail.winnerName })"></dd>
        </div>
      </dl>
      <button class="ump-btn" type="button" @click="askDeleteHistory(historyDetail)" x-text="t('confirmDeleteMatch')"></button>
    </section>

    <div class="ump-pin" x-show="dialog === 'undo'" x-cloak>
      <div class="ump-card ump-pin__card">
        <h2 x-text="t('undo')"></h2>
        <p x-text="t('confirmUndo')"></p>
        <div class="ump-toggle">
          <button class="ump-btn ump-btn--accent" type="button" @click="confirmUndo()" x-text="t('yes')"></button>
          <button class="ump-btn" type="button" @click="dialog = null" x-text="t('no')"></button>
        </div>
      </div>
    </div>

    <div class="ump-pin" x-show="dialog === 'leave'" x-cloak>
      <div class="ump-card ump-pin__card">
        <h2 x-text="t('leaveTitle')"></h2>
        <p x-text="t('leaveMessage')"></p>
        <div class="ump-toggle">
          <button class="ump-btn ump-btn--accent" type="button" @click="confirmLeave()" x-text="t('yes')"></button>
          <button class="ump-btn" type="button" @click="dialog = null" x-text="t('no')"></button>
        </div>
      </div>
    </div>

    <div class="ump-pin" x-show="dialog === 'finish'" x-cloak>
      <div class="ump-card ump-pin__card">
        <template x-if="finishStep === 'reason'">
          <div>
            <h2 x-text="t('finish')"></h2>
            <p x-text="t('finishPrompt')"></p>
            <div class="ump-list" style="margin-top:12px">
              <button class="ump-btn" type="button" @click="pickFinishReason('NORMAL')" x-text="t('finishNormal')"></button>
              <button class="ump-btn" type="button" @click="pickFinishReason('TEST')" x-text="t('finishTest')"></button>
              <button class="ump-btn" type="button" @click="pickFinishReason('RETIREMENT')" x-text="t('finishRetirement')"></button>
              <button class="ump-btn" type="button" @click="pickFinishReason('WALKOVER')" x-text="t('finishWalkover')"></button>
              <button class="ump-btn ump-btn--ghost" type="button" @click="dialog = null" x-text="t('no')"></button>
            </div>
          </div>
        </template>
        <template x-if="finishStep === 'retirement'">
          <div>
            <h2 x-text="t('finishRetirement')"></h2>
            <p x-text="t('finishRetirementPrompt')"></p>
            <div class="ump-list" style="margin-top:12px">
              <button class="ump-btn" type="button" @click="pickRetirement(true)" x-text="matchState() && matchState().getTeam1FullName()"></button>
              <button class="ump-btn" type="button" @click="pickRetirement(false)" x-text="matchState() && matchState().getTeam2FullName()"></button>
              <button class="ump-btn ump-btn--ghost" type="button" @click="dialog = null" x-text="t('cancel')"></button>
            </div>
          </div>
        </template>
        <template x-if="finishStep === 'walkover'">
          <div>
            <h2 x-text="t('finishWalkover')"></h2>
            <p x-text="t('finishWalkoverPrompt')"></p>
            <div class="ump-list" style="margin-top:12px">
              <button class="ump-btn" type="button" @click="pickWalkover(true)" x-text="matchState() && matchState().getTeam1FullName()"></button>
              <button class="ump-btn" type="button" @click="pickWalkover(false)" x-text="matchState() && matchState().getTeam2FullName()"></button>
              <button class="ump-btn ump-btn--ghost" type="button" @click="dialog = null" x-text="t('cancel')"></button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <div class="ump-pin" x-show="pinOpen" x-cloak>
      <div class="ump-card ump-pin__card">
        <h2 x-text="t('pinTitle')"></h2>
        <p x-text="t('pinMessage', { court: pinCourt && pinCourt.name || '' })"></p>
        <div class="ump-pin__boxes">
          <template x-for="(box, index) in pinBoxes" :key="index">
            <div class="ump-pin__box" x-text="box ? '•' : ''"></div>
          </template>
        </div>
        <p class="ump-error" x-show="pinError" x-text="pinError"></p>
        <div class="ump-pad">
          <template x-for="digit in [1,2,3,4,5,6,7,8,9]" :key="digit">
            <button class="ump-btn ump-card" type="button" @click="enterPinDigit(digit)" x-text="digit"></button>
          </template>
          <button class="ump-btn" type="button" @click="closePin()" x-text="t('cancel')"></button>
          <button class="ump-btn ump-card" type="button" @click="enterPinDigit(0)">0</button>
          <button class="ump-btn" type="button" @click="pinBackspace()" x-text="t('pinBack')"></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/umpire/app.js"></script>
</body>
</html>
