<!-- ============ OVERLAY SETTINGS TAB ============ -->
    <div x-show="activeTab === 'settings'" x-cloak class="ov-tryby">

      <div class="ov-tryby-bar">
        <span class="font-black tracking-[0.12em] uppercase text-[15px]">Overlay</span>
        <select class="select select-sm bg-[#1d242c] border-[#2b333c] text-[#e8ecef] font-bold"
                :value="currentOverlayId"
                @change="currentOverlayId = $event.target.value; selectedElIdx = -1; selectedElIdxSet = []; addElCourtId = overlayCourtOptions((overlaySettings.overlays || {})[$event.target.value])[0]?.value || '1'">
          <template x-for="(ov, oid) in (overlaySettings.overlays || {})" :key="'otab_'+oid">
            <option :value="oid" x-text="ov.name || oid"></option>
          </template>
        </select>
        <div class="ov-tryby-modes">
          <button type="button" class="ov-mode-btn" :class="overlayEditorMode === 'layout' && 'is-on'" @click="overlayEditorMode = 'layout'">Układ</button>
          <button type="button" class="ov-mode-btn" :class="overlayEditorMode === 'look' && 'is-on'" @click="overlayEditorMode = 'look'">Wygląd</button>
          <button type="button" class="ov-mode-btn" :class="overlayEditorMode === 'out' && 'is-on'" @click="overlayEditorMode = 'out'">Wyjście</button>
        </div>
        <div class="flex-1"></div>
        <button @click="addOverlay()" class="btn btn-sm btn-ghost text-[#e8ecef]">+ Nowy</button>
        <button x-show="currentOverlayId && Object.keys(overlaySettings.overlays||{}).length > 1"
                @click="removeOverlay()" class="btn btn-sm btn-ghost text-error">Usuń</button>
        <button @click="loadDemoData()" class="btn btn-sm bg-[#1d242c] border border-[#2b333c] text-[#e8ecef]">🎾 Demo dane</button>
        <button x-show="demoPreview" @click="toggleDemoOverlay()" class="btn btn-sm" :class="demoOverlayActive ? 'btn-error' : 'btn-outline'">
          <span x-text="demoOverlayActive ? '● DEMO W OVERLAY' : '▶ Pokaż w overlay'"></span>
        </button>
        <button x-show="demoPreview" @click="clearDemo()" class="btn btn-sm btn-ghost">× Wyczyść</button>
        <span class="font-mono text-xs"
              :class="overlayPreviewStatus() === 'live' ? 'text-[#4ade80]' : overlayPreviewStatus() === 'mock' ? 'text-[#FFD400]' : 'opacity-50'"
              x-text="overlayPreviewStatus() === 'live' ? '● na żywo' : overlayPreviewStatus() === 'mock' ? '● mock TV' : '○ brak meczu'"></span>
      </div>

      <div x-show="currentOverlayId">
        <div class="ov-dock mb-5">
          <div class="canvas-outer" x-ref="canvasOuter"
               @pointermove="onDrag($event)" @pointerup="endDrag($event)" @pointerleave="endDrag($event)"
               @click.self="selectedElIdx = -1; selectedElIdxSet = []">
            <div class="canvas-inner" x-ref="canvasInner" :style="'transform:scale('+canvasScale+')'">
              <div class="canvas-grid"></div>
              <div class="canvas-safe"></div>
              <template x-if="currentOverlay()?.top_bar?.enabled">
                <div style="position:absolute;inset:0;pointer-events:none;z-index:50;">
                  <template x-for="i in (currentOverlay()?.top_bar?.columns || 3)" :key="'gc_'+i">
                    <div :style="topBarGuideStyle(i-1)" class="pointer-events-none"></div>
                  </template>
                </div>
              </template>
              <template x-for="(el, idx) in currentElements()" :key="'el_'+idx">
                <div class="drag-el"
                     :class="{
                       'is-dragging': dragging?.idx === idx,
                       'is-selected': selectedElIdx === idx,
                       'multi-selected': isMultiSelected(idx) && selectedElIdxSet.length > 1,
                       'el-hidden': el.visible === false,
                       'has-h': !!el.h,
                       'zone-top': el.zone === 'top'
                     }"
                     :style="'left:'+el.x+'px;top:'+el.y+'px;width:'+el.w+'px;'+(el.h ? 'height:'+el.h+'px;' : '')"
                     @pointerdown.prevent="startDrag($event, idx)"
                     @click.stop="toggleMultiSelect(idx, $event)"
                     @pointerenter="hoveredElIdx = idx"
                     @pointerleave="hoveredElIdx = -1">
                  <span x-show="el.zone === 'top'" class="zone-badge">GÓRA</span>
                  <template x-if="el.type === 'court'">
                    <div x-html="renderCourtElement(el)"></div>
                  </template>
                  <template x-if="el.type === 'stats'">
                    <div class="sp" x-html="renderStatsPanel(el)"></div>
                  </template>
                  <div class="resize-handle rh-n" @pointerdown.stop.prevent="startResize($event, idx, 'n')"></div>
                  <div class="resize-handle rh-s" @pointerdown.stop.prevent="startResize($event, idx, 's')"></div>
                  <div class="resize-handle rh-e" @pointerdown.stop.prevent="startResize($event, idx, 'e')"></div>
                  <div class="resize-handle rh-w" @pointerdown.stop.prevent="startResize($event, idx, 'w')"></div>
                  <div class="resize-handle rh-ne" @pointerdown.stop.prevent="startResize($event, idx, 'ne')"></div>
                  <div class="resize-handle rh-nw" @pointerdown.stop.prevent="startResize($event, idx, 'nw')"></div>
                  <div class="resize-handle rh-se" @pointerdown.stop.prevent="startResize($event, idx, 'se')"></div>
                  <div class="resize-handle rh-sw" @pointerdown.stop.prevent="startResize($event, idx, 'sw')"></div>
                </div>
              </template>
              <template x-if="currentOverlay()?.watermark?.enabled">
                <img class="ov-watermark" :src="VEST_MEDIA_LOGO_URL" alt="Vest Media" :style="watermarkStyle()">
              </template>
            </div>
            <div class="canvas-coords" x-show="dragging || resizing" x-cloak
                 x-text="resizing ? currentElements()[resizing.idx]?.w+'×'+(currentElements()[resizing.idx]?.h||'auto') : (dragging ? 'x:'+currentElements()[dragging.idx]?.x+' y:'+currentElements()[dragging.idx]?.y : '')"></div>
            <div class="ruler-overlay" x-html="renderRulerSVG()"></div>
          </div>
        </div>

        <div x-show="overlayEditorMode === 'layout'" class="grid grid-cols-1 xl:grid-cols-[1fr_380px] gap-5 items-start">
          <div class="ov-dock">
            <div class="flex items-center mb-3.5">
              <span class="ov-dock-title mb-0">Elementy na obrazie</span>
              <div class="ml-auto flex items-center gap-2">
                <select x-model="addElCourtId" class="select select-xs bg-[#111721] border-[#2b333c] text-[#e8ecef] w-28">
                  <template x-for="option in overlayCourtOptions()" :key="'addel_'+option.value">
                    <option :value="option.value" x-text="option.label"></option>
                  </template>
                </select>
                <button @click="addElement('court')" class="btn btn-sm border-none bg-[#FFD400] text-[#06222B] font-bold">+ Kort</button>
                <button @click="addElement('stats')" class="btn btn-sm bg-[#1d242c] border border-[#2b333c] text-[#e8ecef]">+ Stats</button>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <template x-for="(el, idx) in currentElements()" :key="'eli_'+idx">
                <div class="ov-el-card" :class="{ 'is-on': selectedElIdx === idx, 'is-off': el.visible === false }" @click="selectedElIdx = idx; selectedElIdxSet = [idx]">
                  <div class="flex items-center gap-2 mb-3">
                    <span class="font-black text-[15px]" x-text="elementTitle(el)"></span>
                    <span class="ml-auto font-mono text-[11px] text-[#8b949e]" x-text="elementPlacementLabel(el)"></span>
                    <input type="checkbox" class="toggle toggle-success toggle-sm"
                           :checked="el.visible !== false"
                           @click.stop
                           @change="selectedElIdx = idx; setElProp('visible', $event.target.checked)">
                  </div>
                  <div class="flex items-center gap-2 mb-2">
                    <select class="select select-sm bg-[#111721] border-[#2b333c] text-[#e8ecef] flex-1"
                            :value="el.court_id || '1'"
                            @change="selectedElIdx = idx; setElProp('court_id', $event.target.value)">
                      <template x-for="option in overlayCourtOptions()" :key="'elc_'+idx+'_'+option.value">
                        <option :value="option.value" x-text="option.label"></option>
                      </template>
                    </select>
                    <input type="text" class="input input-sm bg-[#111721] border-[#2b333c] text-[#e8ecef] flex-1"
                           :value="el.label_text || ''" placeholder="Etykieta"
                           @change="selectedElIdx = idx; setElProp('label_text', $event.target.value)">
                  </div>
                  <div class="grid grid-cols-4 gap-2" x-show="el.zone !== 'top' || !currentOverlay()?.top_bar?.enabled">
                    <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">X</span>
                      <input type="number" class="input input-sm font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="el.x" @change="selectedElIdx = idx; setElProp('x', +$event.target.value)"></label>
                    <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">Y</span>
                      <input type="number" class="input input-sm font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="el.y" @change="selectedElIdx = idx; setElProp('y', +$event.target.value)"></label>
                    <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">W</span>
                      <input type="number" class="input input-sm font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="el.w" @change="selectedElIdx = idx; setDimension('w', +$event.target.value)"></label>
                    <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">H</span>
                      <input type="number" class="input input-sm font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="el.h || ''" placeholder="auto" @change="selectedElIdx = idx; setDimension('h', $event.target.value ? +$event.target.value : null)"></label>
                  </div>
                  <div class="flex items-center gap-2 mt-2">
                    <select class="select select-xs bg-[#111721] border-[#2b333c] text-[#e8ecef]"
                            :value="el.zone || 'free'"
                            @change="selectedElIdx = idx; setElZone($event.target.value)">
                      <option value="free">Swobodny</option>
                      <option value="top">Górny pasek</option>
                    </select>
                    <button type="button" class="btn btn-xs btn-ghost text-error ml-auto" @click.stop="selectedElIdx = idx; removeElement()">Usuń</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="ov-dock">
            <div class="ov-dock-title">Szablony układu</div>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" class="ov-tpl text-left" @click="applyTemplate('broadcast')">
                <div class="ov-tpl-thumb"><span style="left:6%;bottom:12%;right:26%;height:22%"></span></div>
                <div class="text-xs font-bold px-2.5 py-2">Canvas TV</div>
              </button>
              <button type="button" class="ov-tpl text-left" @click="applyTemplate('3kort-top')">
                <div class="ov-tpl-thumb">
                  <span style="left:4%;top:8%;width:28%;height:16%"></span>
                  <span style="left:36%;top:8%;width:28%;height:16%"></span>
                  <span style="left:68%;top:8%;width:28%;height:16%"></span>
                </div>
                <div class="text-xs font-bold px-2.5 py-2">3 korty góra</div>
              </button>
              <button type="button" class="ov-tpl text-left" @click="applyTemplate('main+stats')">
                <div class="ov-tpl-thumb">
                  <span style="left:6%;bottom:12%;width:44%;height:22%"></span>
                  <span style="right:6%;bottom:12%;width:26%;height:40%;background:#243036"></span>
                </div>
                <div class="text-xs font-bold px-2.5 py-2">Główny + stats</div>
              </button>
              <button type="button" class="ov-tpl text-left border-dashed min-h-24 flex items-center justify-center text-[#8b949e] text-xs font-bold" @click="saveCurrentAsNewOverlay()">+ Zapisz obecny</button>
            </div>
            <div class="flex flex-wrap gap-1 mt-3">
              <template x-for="option in overlayCourtOptions()" :key="'tpl_focus_'+option.value">
                <button @click="applyTemplate('kort'+option.value+'-focus')" class="btn btn-xs bg-[#1d242c] border border-[#2b333c] text-[#e8ecef]" x-text="option.label + ' focus'"></button>
              </template>
              <button @click="applyTemplate('4kort-top')" class="btn btn-xs bg-[#1d242c] border border-[#2b333c] text-[#e8ecef]">4 korty góra</button>
              <button @click="applyTemplate('all-top')" class="btn btn-xs bg-[#1d242c] border border-[#2b333c] text-[#e8ecef]">Wszystkie góra</button>
            </div>
            <div class="h-px bg-[#232a31] my-4"></div>
            <label class="ov-look-row">
              <span>Autoukrywanie pustych kortów</span>
              <input type="checkbox" class="toggle toggle-success"
                     :checked="currentOverlay()?.auto_hide"
                     @change="updateOverlayProp('auto_hide', $event.target.checked)">
            </label>
            <label class="ov-look-row">
              <span>Siatka górna</span>
              <input type="checkbox" class="toggle toggle-success"
                     :checked="currentOverlay()?.top_bar?.enabled"
                     @change="setTopBarProp('enabled', $event.target.checked)">
            </label>
            <template x-if="currentOverlay()?.top_bar?.enabled">
              <div class="mt-2">
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-xs text-[#8b949e]">Kolumny</span>
                  <button class="btn btn-xs" :class="currentOverlay()?.top_bar?.columns === 3 ? 'bg-[#FFD400] text-[#06222B] border-none' : 'bg-[#1d242c] border-[#2b333c] text-[#e8ecef]'" @click="setTopBarProp('columns', 3)">3</button>
                  <button class="btn btn-xs" :class="currentOverlay()?.top_bar?.columns === 4 ? 'bg-[#FFD400] text-[#06222B] border-none' : 'bg-[#1d242c] border-[#2b333c] text-[#e8ecef]'" @click="setTopBarProp('columns', 4)">4</button>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">Margines X</span>
                    <input type="number" class="input input-xs font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="currentOverlay()?.top_bar?.margin_x || 0" @change="setTopBarProp('margin_x', +$event.target.value)"></label>
                  <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">Góra</span>
                    <input type="number" class="input input-xs font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="currentOverlay()?.top_bar?.margin_top || 0" @change="setTopBarProp('margin_top', +$event.target.value)"></label>
                  <label class="flex flex-col gap-1"><span class="font-mono text-[11px] text-[#8b949e]">Odstęp</span>
                    <input type="number" class="input input-xs font-mono bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="currentOverlay()?.top_bar?.gap ?? 10" @change="setTopBarProp('gap', +$event.target.value)"></label>
                </div>
              </div>
            </template>
            <div class="h-px bg-[#232a31] my-4"></div>
            <div class="ov-dock-title">Overlay</div>
            <label class="flex flex-col gap-1 mb-2"><span class="text-xs text-[#8b949e]">Nazwa</span>
              <input type="text" class="input input-sm bg-[#111721] border-[#2b333c] text-[#e8ecef]" :value="currentOverlay()?.name || ''" @change="updateOverlayProp('name', $event.target.value)"></label>
            <label class="flex flex-col gap-1"><span class="text-xs text-[#8b949e]">Turniej</span>
              <select class="select select-sm bg-[#111721] border-[#2b333c] text-[#e8ecef]"
                      :value="currentOverlay()?.tournament_id || ''"
                      @change="setCurrentOverlayTournament($event.target.value)">
                <option value="">Bez przypisania</option>
                <template x-for="tournament in activeTournamentsList()" :key="'overlay_tournament_'+tournament.id">
                  <option :value="tournament.id" x-text="tournament.name + ' (slot ' + activeTournamentSlot(tournament.id) + ')'"></option>
                </template>
              </select>
            </label>
          </div>
        </div>

        <div x-show="overlayEditorMode === 'look'" class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
          <div class="ov-dock">
            <div class="ov-dock-title">Zawartość scoreboardu</div>
            <label class="ov-look-row"><span>Flagi</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().flags !== false" @change="setLookProp('flags', $event.target.checked)"></label>
            <label class="ov-look-row"><span>Faza / kategoria</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().phase !== false" @change="setLookProp('phase', $event.target.checked)"></label>
            <label class="ov-look-row"><span>Czas meczu</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().clock !== false" @change="setLookProp('clock', $event.target.checked)"></label>
          </div>
          <div class="ov-dock">
            <div class="ov-dock-title">Animacje</div>
            <label class="ov-look-row"><span>Wjazd / zjazd</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().anim_enter !== false" @change="setLookProp('anim_enter', $event.target.checked)"></label>
            <label class="ov-look-row"><span>Błysk punktu</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().anim_point !== false" @change="setLookProp('anim_point', $event.target.checked)"></label>
            <label class="ov-look-row"><span>Puls wygranego gema</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().anim_game !== false" @change="setLookProp('anim_game', $event.target.checked)"></label>
            <label class="ov-look-row"><span>Przejazd światła po secie</span><input type="checkbox" class="toggle toggle-success" :checked="overlayLook().anim_set !== false" @change="setLookProp('anim_set', $event.target.checked)"></label>
            <label class="flex flex-col gap-2 pt-3">
              <span>Tempo animacji <span class="font-mono text-[#8b949e]" x-text="(overlayLook().anim_speed || 1).toFixed(1) + '×'"></span></span>
              <input type="range" min="50" max="200" step="10" :value="Math.round((overlayLook().anim_speed || 1) * 100)" @input="setLookProp('anim_speed', +$event.target.value / 100)">
            </label>
          </div>
          <div class="ov-dock">
            <div class="ov-dock-title">Skala i krycie</div>
            <label class="flex flex-col gap-2 py-2">
              <span>Skala scoreboardu <span class="font-mono text-[#8b949e]" x-text="Math.round((overlayLook().scale || 1) * 100) + '%'"></span></span>
              <input type="range" min="70" max="130" step="5" :value="Math.round((overlayLook().scale || 1) * 100)" @input="setLookProp('scale', +$event.target.value / 100)">
            </label>
            <label class="flex flex-col gap-2 py-2" x-show="selectedEl()?.type === 'court'">
              <span>Krycie tła <span class="font-mono text-[#8b949e]" x-text="Math.round((selectedEl()?.bg_opacity != null ? selectedEl().bg_opacity : 0.95) * 100) + '%'"></span></span>
              <input type="range" min="0" max="100" step="5" :value="Math.round((selectedEl()?.bg_opacity != null ? selectedEl().bg_opacity : 0.95) * 100)" @input="setElProp('bg_opacity', +$event.target.value / 100)">
            </label>
          </div>
        </div>

        <div x-show="overlayEditorMode === 'out'" class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
          <div class="ov-dock">
            <div class="ov-dock-title">Źródła dla OBS</div>
            <div class="flex flex-col gap-2.5">
              <template x-for="(ov, oid) in (overlaySettings.overlays || {})" :key="'url_'+oid">
                <div class="ov-out-url" :class="oid === currentOverlayId && 'is-on'">
                  <div class="flex-1 min-w-0">
                    <div class="font-bold text-sm mb-0.5" x-text="ov.name || oid"></div>
                    <div class="font-mono text-xs text-[#8b949e] truncate" x-text="overlayUrl(oid) || ('Brak slotu: ' + (getTournamentById(ov.tournament_id)?.name || 'nieprzypisany'))"></div>
                  </div>
                  <button x-show="overlayUrl(oid)" @click="copyUrl(overlayUrl(oid))" class="btn btn-sm border-none bg-[#FFD400] text-[#06222B] font-bold">Kopiuj</button>
                </div>
              </template>
            </div>
          </div>
          <div class="ov-dock">
            <div class="ov-dock-title">Watermark Vest Media</div>
            <label class="ov-look-row">
              <span>Pokaż watermark</span>
              <input type="checkbox" class="toggle toggle-success"
                     :checked="!!currentOverlay()?.watermark?.enabled"
                     @change="setWatermarkProp('enabled', $event.target.checked)">
            </label>
            <div class="grid grid-cols-4 gap-2 my-3">
              <button type="button" class="ov-wm-pos" :class="currentOverlay()?.watermark?.position === 'top-left' && 'is-on'" @click="setWatermarkProp('position', 'top-left')">↖</button>
              <button type="button" class="ov-wm-pos" :class="currentOverlay()?.watermark?.position === 'top-right' && 'is-on'" @click="setWatermarkProp('position', 'top-right')">↗</button>
              <button type="button" class="ov-wm-pos" :class="currentOverlay()?.watermark?.position === 'bottom-left' && 'is-on'" @click="setWatermarkProp('position', 'bottom-left')">↙</button>
              <button type="button" class="ov-wm-pos" :class="(currentOverlay()?.watermark?.position || 'bottom-right') === 'bottom-right' && 'is-on'" @click="setWatermarkProp('position', 'bottom-right')">↘</button>
            </div>
            <label class="flex flex-col gap-2 py-2">
              <span>Rozmiar <span class="font-mono text-[#8b949e]" x-text="(currentOverlay()?.watermark?.size || 140) + ' px'"></span></span>
              <input type="range" min="40" max="400" step="10" :value="currentOverlay()?.watermark?.size || 140" @input="setWatermarkProp('size', +$event.target.value)">
            </label>
            <label class="flex flex-col gap-2 py-2">
              <span>Krycie <span class="font-mono text-[#8b949e]" x-text="Math.round((currentOverlay()?.watermark?.opacity != null ? currentOverlay().watermark.opacity : 0.4) * 100) + '%'"></span></span>
              <input type="range" min="10" max="100" step="5" :value="Math.round((currentOverlay()?.watermark?.opacity != null ? currentOverlay().watermark.opacity : 0.4) * 100)" @input="setWatermarkProp('opacity', +$event.target.value / 100)">
            </label>
          </div>
        </div>
      </div>
    </div>
