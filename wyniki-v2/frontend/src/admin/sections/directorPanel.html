      <div x-show="directorPanelOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="card bg-base-100 w-full max-w-2xl shadow-xl">
          <div class="card-body gap-3">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h3 class="card-title">Sterowanie tabletem</h3>
                <p class="text-sm opacity-70">Poniżej widać to, co jest teraz na tablecie. Pola edytujesz tylko tam, gdzie sędzia się pomylił.</p>
              </div>
              <button class="btn btn-sm btn-ghost" @click="directorPanelOpen = false">Zamknij</button>
            </div>
            <div x-show="directorLoading" class="text-sm opacity-70">Ładowanie tabletów…</div>
            <p class="text-sm" x-show="directorForm.sessionCourtId">
              Tablet jest na korcie <span class="font-semibold" x-text="directorForm.sessionCourtId"></span>
              — komenda idzie na tę sesję, nawet gdy mecz w bazie jest już na innym korcie.
            </p>
            <label class="form-control" x-show="directorTablets.length">
              <span class="label-text">Tablet / mecz</span>
              <select class="select select-bordered select-sm" @change="selectDirectorTablet(directorTablets[$event.target.value])">
                <template x-for="(tablet, index) in directorTablets" :key="tablet.match_id || index">
                  <option :value="index" x-text="directorTabletLabel(tablet)"></option>
                </template>
              </select>
            </label>
            <div class="rounded-lg bg-base-200 p-3 text-sm space-y-1" x-show="directorSelected" x-cloak>
              <p class="font-semibold" x-text="directorDeviceCard().title"></p>
              <p class="opacity-70" x-text="directorDeviceCard().source"></p>
              <p x-show="directorDeviceCard().court"><span class="opacity-70">Kort:</span> <span class="font-semibold" x-text="directorDeviceCard().court"></span></p>
              <p x-show="directorDeviceCard().clock"><span class="opacity-70">Czas:</span> <span class="font-semibold" x-text="directorDeviceCard().clock"></span></p>
              <p class="font-semibold" x-text="directorDeviceCard().names"></p>
              <p x-show="directorDeviceCard().score" x-text="directorDeviceCard().score"></p>
              <p class="opacity-70" x-show="directorDeviceCard().rules" x-text="directorDeviceCard().rules"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <label class="form-control">
                <span class="label-text">Kort (ID)</span>
                <select class="select select-bordered select-sm" x-model="directorForm.courtId" @change="loadDirectorPlayers(directorForm.courtId)">
                  <template x-for="court in courts" :key="court.kort_id">
                    <option :value="court.kort_id" x-text="(court.name || court.kort_id) + ' (' + court.kort_id + ')'"></option>
                  </template>
                </select>
              </label>
              <label class="form-control">
                <span class="label-text">Format (gemy / sety do wygranej / TB przy)</span>
                <div class="flex gap-2">
                  <input type="number" min="1" class="input input-bordered input-sm w-20" x-model="directorForm.gamesPerSet">
                  <input type="number" min="1" class="input input-bordered input-sm w-20" x-model="directorForm.setsToWin">
                  <input type="number" min="1" class="input input-bordered input-sm w-20" x-model="directorForm.tiebreakAtGames">
                </div>
              </label>
              <template x-for="side in [{ n: 1, key: 'player1Name', label: 'Zawodnik 1' }, { n: 2, key: 'player2Name', label: 'Zawodnik 2' }]" :key="'dir-player-' + side.n">
                <div class="form-control md:col-span-2" @click.outside="closeDirectorPlayerPicker(side.n)">
                  <span class="label-text" x-text="side.label"></span>
                  <div class="relative">
                    <button type="button" class="btn btn-sm w-full justify-between font-normal border border-base-300 bg-base-100 hover:bg-base-200"
                      @click="directorPlayerPicker === side.n ? closeDirectorPlayerPicker(side.n) : openDirectorPlayerPicker(side.n)">
                      <span class="truncate"
                        :class="directorForm[side.key] && directorForm[side.key] !== '-' ? '' : 'opacity-50'"
                        x-text="directorForm[side.key] && directorForm[side.key] !== '-' ? directorForm[side.key] : 'Wybierz z listy zawodników'"></span>
                      <span class="opacity-40 text-xs">▾</span>
                    </button>
                    <div x-show="directorPlayerPicker === side.n" x-cloak class="absolute left-0 right-0 z-[60] mt-1 overflow-hidden rounded-lg border border-base-300 bg-base-100 shadow-xl">
                      <div class="border-b border-base-300 p-2">
                        <input type="search" :data-director-player-search="side.n" autocomplete="off" placeholder="Szukaj nazwiska…"
                          class="input input-sm input-bordered w-full"
                          x-model="directorPlayerQuery"
                          @keydown.enter.prevent="pickFirstDirectorPlayer()"
                          @keydown.escape.prevent="closeDirectorPlayerPicker(side.n)">
                      </div>
                      <ul class="max-h-56 overflow-y-auto py-1">
                        <template x-for="player in directorFilteredPlayers()" :key="player.id">
                          <li>
                            <button type="button" class="flex w-full items-baseline justify-between gap-3 px-3 py-2 text-left text-sm hover:bg-base-200"
                              :class="directorForm[side.key] === directorPlayerName(player) ? 'bg-base-200 font-semibold' : ''"
                              @click="pickDirectorPlayer(side.n, player)">
                              <span x-text="directorPlayerName(player)"></span>
                              <span class="shrink-0 text-xs opacity-50" x-show="player.category || player.country" x-text="[player.category, player.country].filter(Boolean).join(' · ')"></span>
                            </button>
                          </li>
                        </template>
                      </ul>
                      <p class="px-3 py-2 text-xs opacity-60" x-show="!directorPlayers.length">Brak zawodników tego turnieju w bazie.</p>
                      <p class="px-3 py-2 text-xs opacity-60" x-show="directorPlayers.length && !directorFilteredPlayers().length">Brak wyników.</p>
                    </div>
                  </div>
                </div>
              </template>
              <label class="form-control">
                <span class="label-text">Sety</span>
                <div class="flex gap-2">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player1Sets">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player2Sets">
                </div>
              </label>
              <label class="form-control">
                <span class="label-text">Gemy</span>
                <div class="flex gap-2">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player1Games">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player2Games">
                </div>
              </label>
              <label class="form-control">
                <span class="label-text">Punkty (surowe)</span>
                <div class="flex gap-2">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player1Points">
                  <input type="number" min="0" class="input input-bordered input-sm w-20" x-model="directorForm.player2Points">
                </div>
              </label>
              <label class="form-control">
                <span class="label-text">Zasady</span>
                <label class="label cursor-pointer justify-start gap-2"><input type="checkbox" class="checkbox checkbox-sm" x-model="directorForm.noAdvantage"><span class="label-text">No-Ad</span></label>
                <label class="label cursor-pointer justify-start gap-2"><input type="checkbox" class="checkbox checkbox-sm" x-model="directorForm.tiebreakOnly"><span class="label-text">Tylko tiebreak</span></label>
              </label>
            </div>
            <div class="card-actions justify-end">
              <button class="btn btn-ghost btn-sm" @click="directorPanelOpen = false">Anuluj</button>
              <button class="btn btn-primary btn-sm" :disabled="directorSaving" @click="applyDirectorControl()" x-text="directorSaving ? 'Wysyłanie…' : 'Wyślij na tablet'"></button>
            </div>
          </div>
        </div>
      </div>
