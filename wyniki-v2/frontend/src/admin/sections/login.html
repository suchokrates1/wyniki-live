    <div x-show="adminNeedsAuth" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-base-300/90 p-4">
      <form @submit.prevent="loginAdmin" class="card w-full max-w-sm bg-base-100 shadow-xl">
        <div class="card-body">
          <h1 class="card-title">Panel administratora</h1>
          <p>Podaj hasło administratora, aby zarządzać turniejami i nakładkami.</p>
          <label class="form-control">
            <span class="label-text">Hasło</span>
            <div class="relative">
              <input x-model="adminPassword" :type="passwordVisible.admin ? 'text' : 'password'" type="password" autocomplete="current-password" class="input input-bordered w-full pr-12" required autofocus>
              <button type="button" class="absolute inset-y-0 right-0 z-10 flex w-11 items-center justify-center opacity-60 hover:opacity-100" @click="passwordVisible.admin = !passwordVisible.admin" :aria-label="passwordVisible.admin ? 'Ukryj hasło' : 'Pokaż hasło'" :aria-pressed="passwordVisible.admin">
                <svg x-show="!passwordVisible.admin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                <svg x-show="passwordVisible.admin" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
              </button>
            </div>
          </label>
          <p x-show="adminAuthError" x-text="adminAuthError" class="text-error" role="alert"></p>
          <button class="btn btn-primary" type="submit">Zaloguj</button>
          <p class="text-sm mt-3 opacity-80">
            Logowanie zapisuje sesję administratora na tym urządzeniu.
            <a class="link link-primary underline" href="/privacy?lang=pl">Polityka prywatności</a>
          </p>
        </div>
      </form>
    </div>
