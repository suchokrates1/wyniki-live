<div class="adm-modal" x-show="tournamentCreateOpen" x-cloak @keydown.escape.window="closeTournamentCreate()">
  <div class="adm-modal__box" role="dialog" aria-modal="true" aria-labelledby="adm-create-title">
    <div class="adm-modal__head">
      <div>
        <h2 class="adm-modal__title" id="adm-create-title">Nowy turniej</h2>
        <p class="adm-modal__lead">Po zapisaniu turniej jest wyłączony. Włączysz go przełącznikiem na liście, gdy plan będzie gotowy.</p>
      </div>
      <button type="button" class="adm-btn adm-btn--quiet" @click="closeTournamentCreate()" aria-label="Zamknij okno">×</button>
    </div>

    <div class="adm-modal__body">

    <div class="adm-grid">
      <template x-for="field in adminCreateFields()" :key="field.id">
        <div class="adm-field" :class="field.wide ? 'adm-field--wide' : ''">
          <label class="adm-field__label" :for="field.id" x-text="field.label"></label>
          <template x-if="field.type === 'select'">
            <select
              class="adm-input adm-field__input"
              :id="field.id"
              :value="newTournament[field.key]"
              @change="newTournament[field.key] = $event.target.value"
            >
              <template x-for="option in field.options" :key="option.value">
                <option :value="option.value" x-text="option.label" :selected="newTournament[field.key] === option.value"></option>
              </template>
            </select>
          </template>
          <template x-if="field.type !== 'select'">
            <input
              class="adm-input adm-field__input"
              :id="field.id"
              :type="field.type"
              :min="field.min"
              :placeholder="field.placeholder || ''"
              :value="newTournament[field.key]"
              @input="newTournament[field.key] = $event.target.value"
            >
          </template>
          <span class="adm-field__hint" x-show="field.hint" x-text="field.hint"></span>
        </div>
      </template>
    </div>

    <h3 class="adm-subhead">Widoczność</h3>
    <div class="adm-flags">
      <template x-for="flag in adminCreateFlags()" :key="flag.key">
        <label class="adm-flag" :class="{ 'is-on': newTournament[flag.key] }">
          <input type="checkbox" x-model="newTournament[flag.key]">
          <span class="adm-flag__body">
            <span class="adm-flag__label" x-text="flag.label"></span>
            <span class="adm-flag__hint" x-text="flag.hint"></span>
          </span>
        </label>
      </template>
    </div>

    <p class="adm-modal__error" role="alert" x-show="tournamentCreateError" x-text="tournamentCreateError"></p>
    </div>

    <div class="adm-card__footer">
      <button type="button" class="adm-btn adm-btn--primary" @click="submitTournamentCreate()">Utwórz turniej</button>
      <button type="button" class="adm-btn adm-btn--quiet" @click="closeTournamentCreate()">Anuluj</button>
      <span class="adm-modal__note">Logo i kategorie dodasz w ustawieniach turnieju.</span>
    </div>
  </div>
</div>
