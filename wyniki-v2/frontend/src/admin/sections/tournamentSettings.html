<section class="adm-card" aria-labelledby="adm-settings-title">
  <div class="adm-card__head">
    <h2 id="adm-settings-title" class="adm-card__title" x-text="editTournament.name || 'Ustawienia turnieju'"></h2>
    <span class="adm-card__hint" x-text="adminEditTournamentMeta()"></span>
    <div class="adm-card__actions">
      <button type="button" class="adm-btn" @click="cancelTournamentEdit()">Powrót do listy</button>
    </div>
  </div>

  <div class="adm-grid">
    <template x-for="field in adminTournamentFields()" :key="field.id">
      <div class="adm-field" :class="field.wide ? 'adm-field--wide' : ''">
        <label class="adm-field__label" :for="field.id" x-text="field.label"></label>
        <input
          class="adm-input adm-field__input"
          :id="field.id"
          :type="field.type"
          :min="field.min"
          :value="editTournament[field.key]"
          @input="editTournament[field.key] = $event.target.value"
        >
        <span class="adm-field__hint" x-show="field.hint" x-text="field.hint"></span>
      </div>
    </template>

    <div class="adm-field">
      <label class="adm-field__label" for="adm-edit-office-password">Hasło modułu biura</label>
      <input
        id="adm-edit-office-password"
        class="adm-input adm-field__input"
        :type="passwordVisible.officeEdit ? 'text' : 'password'"
        autocomplete="new-password"
        x-model="editTournament.office_password"
      >
      <span class="adm-field__hint">
        <button type="button" class="adm-link" @click="passwordVisible.officeEdit = !passwordVisible.officeEdit" x-text="passwordVisible.officeEdit ? 'Ukryj hasło' : 'Pokaż hasło'"></button>
        <span x-show="editTournament.has_office_password"> · hasło jest już ustawione, wpisz nowe, by nadpisać</span>
      </span>
    </div>

    <div class="adm-field">
      <label class="adm-field__label" for="adm-edit-logo">Nowe logo</label>
      <input id="adm-edit-logo" class="adm-input adm-field__input" type="file" accept="image/*" @change="onEditTournamentLogoSelected($event)">
      <span class="adm-field__hint">
        <template x-if="editTournament.logo_path">
          <a class="adm-link" :href="editTournament.logo_path" target="_blank" rel="noopener">Obecne logo</a>
        </template>
      </span>
    </div>
  </div>

  <h3 class="adm-subhead">Widoczność</h3>
  <div class="adm-flags">
    <template x-for="flag in adminTournamentFlags()" :key="flag.key">
      <label class="adm-flag" :class="{ 'is-on': editTournament[flag.key], 'is-off': flag.disabled }">
        <input type="checkbox" x-model="editTournament[flag.key]" :disabled="flag.disabled">
        <span class="adm-flag__body">
          <span class="adm-flag__label" x-text="flag.label"></span>
          <span class="adm-flag__hint" x-text="flag.hint"></span>
        </span>
      </label>
    </template>
  </div>

  <div class="adm-card__footer">
    <button type="button" class="adm-btn adm-btn--primary" @click="saveTournamentEdit()">Zapisz turniej</button>
    <button type="button" class="adm-btn adm-btn--quiet" @click="cancelTournamentEdit()">Anuluj</button>
  </div>
</section>
