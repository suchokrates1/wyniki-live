<section class="adm-card" aria-labelledby="adm-devices-title">
  <div class="adm-card__head">
    <h2 id="adm-devices-title" class="adm-card__title">Tablety</h2>
    <span class="adm-card__hint">każdy tablet, który otworzy aplikację, pojawia się tu jako nowy — nazwij go, a przejdzie niżej</span>
  </div>

  <p class="adm-modal__error" role="alert" x-show="devicesError" x-text="devicesError"></p>

  <template x-for="bucket in adminDeviceBuckets()" :key="bucket.id">
    <div class="adm-group" x-show="bucket.rows.length || bucket.id === 'new'">
      <h3 class="adm-group__title">
        <span x-text="bucket.title"></span>
        <span class="adm-chip" :class="bucket.id === 'new' ? 'adm-chip--live' : ''" x-text="bucket.rows.length"></span>
      </h3>

      <p class="adm-empty" x-show="!bucket.rows.length" x-text="bucket.empty"></p>

      <ul class="adm-rows" role="list">
        <template x-for="row in bucket.rows" :key="row.android_id">
          <li class="adm-row adm-row--device">
            <div class="adm-device__head">
              <span class="adm-device__model" x-text="adminDeviceModel(row)"></span>
              <span class="adm-row__meta" x-text="adminDeviceMeta(row)"></span>
            </div>

            <div class="adm-device__controls">
              <div class="adm-device__field adm-device__field--name">
                <label class="adm-field__label" :for="'adm-dev-name-' + row.android_id">Nazwa tabletu</label>
                <input
                  :id="'adm-dev-name-' + row.android_id"
                  type="text"
                  class="adm-input adm-device__name"
                  placeholder="np. Tablet 5"
                  x-model="row.nameDraft"
                >
              </div>

              <div class="adm-device__field">
                <label class="adm-field__label" :for="'adm-dev-alert-' + row.android_id">Próg baterii %</label>
                <input
                  :id="'adm-dev-alert-' + row.android_id"
                  type="text"
                  inputmode="numeric"
                  class="adm-input adm-device__alert"
                  placeholder="20"
                  x-model="row.alertDraft"
                >
              </div>

              <div class="adm-device__field adm-device__field--battery">
                <span class="adm-field__label" aria-hidden="true">Bateria</span>
                <span class="adm-device__value adm-court__battery" :class="'is-' + adminDeviceBattery(row).tone">
                  <span class="sr-only">Bateria: </span><span x-text="adminDeviceBattery(row).text"></span>
                </span>
              </div>

              <label class="adm-device__test">
                <input type="checkbox" x-model="row.testDraft">
                <span>Testowy</span>
              </label>

              <button type="button" class="adm-btn adm-btn--primary adm-device__save" @click="saveDevice(row)" x-text="bucket.id === 'new' ? 'Nazwij' : 'Zapisz'"></button>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </template>
</section>
