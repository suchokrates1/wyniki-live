<div class="adm-stack">
  <section class="adm-card" aria-labelledby="org-live-title">
    <h2 id="org-live-title" class="adm-card__title" x-text="ot('dayTitle')"></h2>
    <p x-text="ot(t.active ? 'liveOn' : 'liveOff')"></p>
    <div class="adm-card__footer" x-show="!t.read_only">
      <button type="button" class="adm-btn" :class="t.active ? '' : 'adm-btn--primary'" @click="toggleLive()" x-text="ot(t.active ? 'endTournament' : 'startTournament')"></button>
      <button type="button" class="adm-btn adm-btn--primary" x-show="t.office_slot" @click="openOffice()" x-text="ot('openOffice')"></button>
    </div>
  </section>

  <section class="adm-card" aria-labelledby="org-courts-title">
    <h2 id="org-courts-title" class="adm-card__title" x-text="ot('courtsTitle')"></h2>
    <p class="adm-card__hint" x-text="ot('courtsHint')"></p>
    <ul class="adm-rows" role="list">
      <template x-for="court in t.courts" :key="court.kort_id">
        <li class="adm-row">
          <div class="adm-row__main"><span class="adm-row__name" x-text="ot('court', { name: court.name })"></span></div>
          <form class="adm-row__actions" @submit.prevent="savePin(court)">
            <label class="sr-only" :for="'org-pin-' + court.kort_id" x-text="ot('courtPin', { name: court.name })"></label>
            <input class="adm-input adm-mono org-pin" :id="'org-pin-' + court.kort_id" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" x-model="tPins[court.kort_id]" :disabled="t.read_only">
            <button type="submit" class="adm-btn" x-show="!t.read_only" :disabled="tPins[court.kort_id] === court.pin"><span x-text="ot('savePin')"></span><span class="sr-only" x-text="': ' + ot('court', { name: court.name })"></span></button>
          </form>
        </li>
      </template>
    </ul>
    <p class="adm-empty" x-show="!t.courts.length" x-text="ot('noCourts')"></p>
  </section>

  <section class="adm-card" aria-labelledby="org-overlay-title">
    <h2 id="org-overlay-title" class="adm-card__title" x-text="ot('overlaysTitle')"></h2>
    <p class="adm-card__hint" x-text="ot('overlaysHint')"></p>
    <ul class="adm-rows" role="list">
      <template x-for="link in t.overlays" :key="link.id">
        <li class="adm-row">
          <div class="adm-row__main">
            <span class="adm-row__name" x-text="link.name"></span>
            <div class="adm-row__meta adm-mono" x-text="overlayUrl(link) || ot('overlayLater')"></div>
          </div>
        </li>
      </template>
    </ul>
    <p class="adm-empty" x-show="!t.overlays.length" x-text="ot('noOverlays')"></p>
  </section>
</div>
