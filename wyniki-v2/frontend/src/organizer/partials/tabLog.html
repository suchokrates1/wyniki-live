<section class="adm-card" aria-labelledby="org-log-title">
  <h2 id="org-log-title" class="adm-card__title" x-text="ot('logTitle')"></h2>
  <p class="adm-card__hint" x-text="ot('logHint')"></p>
  <ol class="adm-rows org-log" role="list">
    <template x-for="entry in tLog" :key="entry.id">
      <li class="adm-row">
        <div class="adm-row__main">
          <div class="adm-row__title"><span class="adm-row__name" x-text="logLine(entry)"></span></div>
          <div class="adm-row__meta" x-text="entry.account_email + ' · ' + logWhen(entry)"></div>
        </div>
      </li>
    </template>
  </ol>
  <p class="adm-empty" x-show="!tLog.length" x-text="ot('noLog')"></p>
</section>
