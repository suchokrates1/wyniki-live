<form class="adm-card" @submit.prevent="saveSettings()" aria-labelledby="org-settings-title">
  <h2 id="org-settings-title" class="adm-card__title" x-text="ot('settingsTitle')"></h2>
  <fieldset class="org-fieldset" :disabled="t.read_only">
    <div class="adm-grid">
      <div class="adm-field adm-field--wide"><label class="adm-field__label" for="org-set-name" x-text="ot('fieldName')"></label><input class="adm-input" id="org-set-name" x-model="tForm.name" required></div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-start" x-text="ot('fieldStart')"></label><input class="adm-input" type="date" id="org-set-start" x-model="tForm.start_date" required></div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-end" x-text="ot('fieldEnd')"></label><input class="adm-input" type="date" id="org-set-end" x-model="tForm.end_date" required></div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-city" x-text="ot('fieldCity')"></label><input class="adm-input" id="org-set-city" x-model="tForm.city"></div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-country" x-text="ot('fieldCountry')"></label><input class="adm-input" id="org-set-country" maxlength="2" x-model="tForm.country"></div>
      <div class="adm-field">
        <label class="adm-field__label" for="org-set-courts" x-text="ot('fieldCourts')"></label>
        <input class="adm-input" type="number" min="0" :max="t.max_courts || 30" id="org-set-courts" x-model.number="tForm.court_count" aria-describedby="org-set-courts-hint">
        <span class="adm-field__hint" id="org-set-courts-hint" x-show="t.max_courts" x-text="ot('courtsPlan', { n: t.max_courts })"></span>
      </div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-report" x-text="ot('fieldReport')"></label><input class="adm-input" type="email" id="org-set-report" x-model="tForm.report_email"></div>
      <div class="adm-field">
        <label class="adm-field__label" for="org-set-scope" x-text="ot('fieldScope')"></label>
        <select class="adm-input" id="org-set-scope" x-model="tForm.title_scope">
          <template x-for="scope in titleScopes()" :key="scope.value">
            <option :value="scope.value" x-text="ot(scope.key)" :selected="tForm.title_scope === scope.value"></option>
          </template>
        </select>
      </div>
      <div class="adm-field"><label class="adm-field__label" for="org-set-title" x-text="ot('fieldTitleOverride')"></label><input class="adm-input" id="org-set-title" maxlength="80" x-model="tForm.title_override"></div>
      <div class="adm-field">
        <label class="adm-field__label" for="org-set-office" x-text="ot('fieldNewOfficePassword')"></label>
        <input class="adm-input" type="password" autocomplete="new-password" id="org-set-office" x-model="tForm.office_password" aria-describedby="org-set-office-hint">
        <span class="adm-field__hint" id="org-set-office-hint" x-text="ot(t.has_office_password ? 'officeSet' : 'officeNotSet')"></span>
      </div>
    </div>

    <div class="org-checks">
      <label class="org-check">
        <input type="checkbox" x-model="tForm.is_public" :disabled="t.visibility_lock === 'private' || tForm.is_simulation" aria-describedby="org-set-public-hint">
        <span x-text="ot('publicOnSite')"></span>
      </label>
      <p class="adm-field__hint" id="org-set-public-hint" x-show="t.visibility_lock === 'private'" x-text="ot('lockedHint')"></p>
      <label class="org-check"><input type="checkbox" x-model="tForm.is_simulation"> <span x-text="ot('simulation')"></span></label>
    </div>
  </fieldset>
  <div class="adm-card__footer" x-show="!t.read_only">
    <button type="submit" class="adm-btn adm-btn--primary" x-text="ot('saveSettings')"></button>
  </div>
</form>
