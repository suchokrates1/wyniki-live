<!-- One knockout tree: the whole drawing on wide screens, swipeable phases on a phone. Expects `tree`. -->
<div class="btv-tree-wrap">
  <div class="btv-tree-scroll" tabindex="0" role="region" :aria-label="tree.title" :style="'--btv-need: ' + (tree.geometry.width + 42) + 'px'">
    <template x-for="geo in [tree.geometry]" :key="tree.key + '-full'">
      <!-- @partial treeCanvas -->
    </template>
  </div>

  <template x-for="phases in [tree.tabletPhases]" :key="tree.key + '-tablet'">
    <div class="btv-phases btv-phases--tablet"><!-- @partial treePhases --></div>
  </template>
  <template x-for="phases in [tree.phases]" :key="tree.key + '-phone'">
    <div class="btv-phases btv-phases--phone"><!-- @partial treePhases --></div>
  </template>
</div>
