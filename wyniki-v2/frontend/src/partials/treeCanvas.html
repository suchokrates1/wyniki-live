<!-- Cards, connectors and labels of a tree or of one phone phase; expects `geo` (bracketGeometry.js). -->
<div class="btv-tree" :style="bracketBox(geo)">
  <template x-for="(label, li) in geo.labels" :key="'l' + li">
    <div class="btv-round-label" :class="'is-' + label.tone" :style="bracketPos(label)" aria-hidden="true" x-text="label.text"></div>
  </template>
  <template x-for="(conn, ci) in geo.conns" :key="'c' + ci">
    <div class="btv-conn" :style="bracketStyle(conn.style)" aria-hidden="true"></div>
  </template>
  <template x-if="geo.champ">
    <div class="btv-champ" :style="bracketBox(geo.champ) + '; ' + bracketPos(geo.champ)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--bt-gold-text)"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
      <span class="btv-champ__title" x-text="geo.champ.title"></span>
      <template x-if="geo.champ.href">
        <a class="btv-champ__name" :href="geo.champ.href" x-text="resolveBracketName(geo.champ.name)"></a>
      </template>
      <template x-if="!geo.champ.href">
        <span class="btv-champ__name" x-text="resolveBracketName(geo.champ.name)"></span>
      </template>
    </div>
  </template>
  <ol>
    <template x-for="entry in geo.cards" :key="entry.key">
      <li class="btv-slot" :style="bracketPos(entry)">
        <span class="sr-only" x-text="entry.round"></span>
        <template x-for="card in [entry.card]" :key="entry.key + '-card'">
          <!-- @partial matchCard -->
        </template>
      </li>
    </template>
  </ol>
</div>
