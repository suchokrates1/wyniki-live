<!-- The player profile; expects `p` (profileModel.js) in scope. Match cards are the bracket's. -->
<div class="btv pfv">
  <header class="pfv-head">
    <div class="pfv-who">
      <span class="pfv-avatar" aria-hidden="true">
        <template x-if="p.photo"><img :src="p.photo" alt=""></template>
        <template x-if="!p.photo"><span x-text="p.initials"></span></template>
      </span>
      <div class="pfv-who__text">
        <h2 class="pfv-name" x-text="p.name"></h2>
        <div class="pfv-actions">
          <button type="button" class="pfv-action" x-show="playerProfile.player.name_audio_url" @click="playProfileName()" :aria-label="profileText('listenName', 'Odsłuchaj nazwisko') + ', ' + p.name"><span aria-hidden="true" x-text="profileText('listenName', 'Odsłuchaj nazwisko')"></span></button>
          <button type="button" class="pfv-action" x-ref="profileReportButton" @click="openProfileReport()" :aria-label="profileText('reportError', 'Zgłoś błąd') + ', ' + p.name"><span aria-hidden="true" x-text="profileText('reportError', 'Zgłoś błąd')"></span></button>
        </div>
        <ul class="pfv-chips">
          <li x-show="p.country"><span class="btv-cc" aria-hidden="true" x-text="p.country"></span><span class="sr-only" x-text="(tr().playerProfile?.country || 'Kraj') + ': ' + countryName(p.country)"></span></li>
          <li x-show="formatPlayerClassification(playerProfile.player.category)" class="is-strong"><span class="sr-only" x-text="(tr().playerProfile?.category || 'Kategoria') + ': ' + formatPlayerClassification(playerProfile.player.category)"></span><span aria-hidden="true" x-text="formatPlayerClassification(playerProfile.player.category)"></span></li>
          <li x-show="playerProfile.player.gender" x-text="playerProfile.player.gender === 'M' ? (tr().playerProfile?.male || 'Mężczyzna') : (tr().playerProfile?.female || 'Kobieta')"></li>
          <li x-show="playerProfile.player.age" x-text="ageText(playerProfile.player.age)"></li>
        </ul>
      </div>
    </div>
    <ul class="pfv-medals" :aria-label="tr().playerProfile?.medals || 'Medale'">
      <template x-for="medal in ['gold', 'silver', 'bronze']" :key="medal">
        <li class="pfv-medal" :class="'is-' + medal + (p.medals[medal] ? '' : ' is-none')">
          <span class="pfv-medal__count" aria-hidden="true" x-text="p.medals[medal] || 0"></span>
          <span class="pfv-medal__label" aria-hidden="true" x-text="tr().playerProfile?.[medal] || medal"></span>
          <span class="sr-only" x-text="(tr().playerProfile?.[medal] || medal) + ': ' + (p.medals[medal] || 0)"></span>
        </li>
      </template>
    </ul>
  </header>

  <dl class="pfv-tiles">
    <div class="pfv-tile"><dt x-text="tr().playerProfile?.tournaments || 'Turnieje'"></dt><dd x-text="p.tiles.tournaments"></dd></div>
    <div class="pfv-tile"><dt x-text="tr().playerProfile?.matches || 'Mecze'"></dt><dd x-text="p.tiles.matches"></dd></div>
    <div class="pfv-tile"><dt x-text="bracketText('record')"></dt><dd x-text="p.tiles.record"></dd></div>
    <div class="pfv-tile"><dt x-text="tr().bracket?.setsHeader || 'Sety'"></dt><dd x-text="p.tiles.sets"></dd></div>
    <div class="pfv-tile" x-show="p.tiles.winRate !== null"><dt x-text="tr().playerProfile?.winRate || 'Skuteczność'"></dt><dd x-text="p.tiles.winRate + '%'"></dd></div>
  </dl>

  <div class="pfv-columns">
    <section class="btv-section pfv-main" aria-labelledby="pfv-tournaments-title">
      <h3 id="pfv-tournaments-title" class="btv-h" x-text="tr().playerProfile?.tournamentHistory || 'Historia turniejów'"></h3>
      <p class="btv-intro" x-show="!p.tournaments.length" x-text="tr().playerProfile?.noTournaments || 'Brak turniejów'"></p>
      <template x-for="t in p.tournaments" :key="'pt-' + t.id">
        <details class="btv-fold pfv-tournament" :open="t.open">
          <summary>
            <span class="btv-fold__title">
              <strong x-text="t.name"></strong>
              <span x-text="[t.city, profileDateRange(t.start, t.end), t.category ? translateCategory(t.category) : ''].filter(Boolean).join(' · ')"></span>
            </span>
            <span class="pfv-result" :class="'is-' + (t.result.medal || t.result.kind)" x-text="profileResultText(t.result)"></span>
            <span class="pfv-wl" x-text="t.wins + '–' + t.losses"></span>
            <svg class="btv-chev" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg>
          </summary>
          <div class="pfv-body">
            <ol class="pfv-path" :aria-label="profileViewText('pathLabel')">
              <template x-for="(step, si) in t.path" :key="si">
                <li class="pfv-step" :class="step.won === true ? 'is-won' : (step.won === false ? 'is-lost' : '')">
                  <span aria-hidden="true" x-text="profileStepLabel(step)"></span>
                  <strong x-show="step.won !== null" aria-hidden="true" x-text="step.won ? (tr().playerProfile?.won || 'W') : (tr().playerProfile?.lost || 'P')"></strong>
                  <span class="sr-only" x-text="profileStepLabel(step) + (step.won === null ? '' : ', ' + (step.won ? profileText('resultWon', 'Wygrana') : profileText('resultLost', 'Porażka')))"></span>
                </li>
              </template>
            </ol>
            <ul class="pfv-matches">
              <template x-for="m in t.matches" :key="m.key">
                <li class="pfv-match">
                  <template x-for="card in [m.card]" :key="m.key + '-c'">
                    <!-- @partial matchCard -->
                  </template>
                  <p class="pfv-match__meta">
                    <strong :class="m.won ? 'is-won' : 'is-lost'" aria-hidden="true" x-text="m.won ? profileText('resultWon', 'Wygrana') : profileText('resultLost', 'Porażka')"></strong>
                    <span aria-hidden="true" x-text="[profilePhaseLabel(m.phase), profileDate(m.date)].filter(Boolean).join(' · ')"></span>
                    <span class="sr-only" x-text="'. ' + [m.won ? profileText('resultWon', 'Wygrana') : profileText('resultLost', 'Porażka'), profilePhaseLabel(m.phase), profileDate(m.date)].filter(Boolean).join(', ')"></span>
                  </p>
                </li>
              </template>
            </ul>
            <p class="btv-intro" x-show="!t.matches.length" x-text="tr().playerProfile?.noMatches || 'Brak meczów'"></p>
          </div>
        </details>
      </template>
    </section>

    <aside class="pfv-aside">
      <section class="pfv-card" x-show="p.rivals.length" aria-labelledby="pfv-rivals-title">
        <h3 id="pfv-rivals-title" x-text="profileViewText('rivalsTitle')"></h3>
        <ul class="pfv-rivals">
          <template x-for="rival in p.rivals" :key="rival.name">
            <li>
              <span class="btv-cc" aria-hidden="true" x-text="rival.country"></span>
              <span class="pfv-rivals__who">
                <template x-if="rival.href"><a class="btv-who__name" :href="rival.href" x-text="resolveBracketName(rival.name)"></a></template>
                <template x-if="!rival.href"><span x-text="resolveBracketName(rival.name)"></span></template>
                <span class="pfv-rivals__n" aria-hidden="true" x-text="profileViewText('rivalPlayed', { n: rival.played })"></span>
              </span>
              <strong class="pfv-rivals__wl" :class="'is-' + rival.tone" aria-hidden="true" x-text="rival.wins + '–' + rival.losses"></strong>
              <span class="sr-only" x-text="', ' + profileViewText('rivalPlayed', { n: rival.played }) + ', ' + bracketScoreText(tr().bracketView?.record || 'Bilans', rival.wins + '–' + rival.losses)"></span>
            </li>
          </template>
        </ul>
      </section>
      <section class="pfv-card" x-show="p.medalsByCategory.length" aria-labelledby="pfv-medals-title">
        <h3 id="pfv-medals-title" x-text="profileText('medalsByCategory', 'Medale według kategorii')"></h3>
        <ul class="pfv-plain">
          <template x-for="bucket in p.medalsByCategory" :key="'mc-' + bucket.category">
            <li x-text="profileMedalCategoryText(bucket)"></li>
          </template>
        </ul>
      </section>
      <section class="pfv-card" x-show="profileClassHistory().length" aria-labelledby="pfv-classes-title">
        <h3 id="pfv-classes-title" x-text="profileText('classTitle', 'Historia kategorii')"></h3>
        <p class="pfv-note" x-text="profileText('classNote', 'Wyniki zostają w kategorii, w której zostały rozegrane.')"></p>
        <ol class="pfv-plain">
          <template x-for="(row, index) in profileClassHistory()" :key="'pc-' + index">
            <li><strong aria-hidden="true" x-text="row.classification"></strong><span aria-hidden="true"> · </span><span x-text="profileClassEntryText(row) + (index === profileClassHistory().length - 1 ? ', ' + profileText('classCurrent', 'aktualna') : '')"></span></li>
          </template>
        </ol>
      </section>
      <section class="pfv-card pfv-data" aria-labelledby="pfv-data-title">
        <h3 id="pfv-data-title" x-text="profileViewText('dataTitle')"></h3>
        <p class="pfv-note" x-text="profileViewText('dataNote')"></p>
        <p class="pfv-data__links">
          <a :href="profileDataMailto(p.name)" x-text="profileViewText('dataMail')"></a>
          <span aria-hidden="true">·</span>
          <a :href="privacyHref('rights')" x-text="profileViewText('dataPolicy')"></a>
        </p>
        <p class="pfv-data__mail">contact@blindtennis.app</p>
      </section>
    </aside>
  </div>

  <template x-teleport="body">
  <div class="pfv-report" x-ref="profileReportLayer" x-show="profileReportOpen" x-cloak @keydown.escape.window="closeProfileReport()" @keydown.tab="trapProfileReport($event)">
    <div class="pfv-report__box" x-ref="profileReportBox" role="dialog" aria-modal="true" aria-labelledby="pfv-report-title" aria-describedby="pfv-report-hint">
      <h3 id="pfv-report-title" x-text="profileText('reportTitle', 'Zgłoś błąd w profilu')"></h3>
      <p id="pfv-report-hint" class="pfv-note" x-show="profileReportStatus !== 'sent'" x-text="profileText('reportHint', 'Napisz, co jest nie tak: odczytanie nazwiska, imię, kategoria, kraj albo wynik.')"></p>
      <p class="pfv-note" role="status" x-show="profileReportStatus === 'sent'" x-text="profileText('reportSent', 'Zgłoszenie zapisane. Dziękujemy.')"></p>
      <p class="pfv-note" role="alert" x-show="profileReportStatus === 'failed'" x-text="profileText('reportFailed', 'Nie udało się wysłać. Spróbuj jeszcze raz.')"></p>
      <p class="pfv-note" role="status" x-show="profileReportStatus === 'limit'" x-text="profileText('reportLimit', 'To zgłoszenie już do nas dotarło. Dziękujemy.')"></p>
      <form x-show="profileReportStatus !== 'sent'" @submit.prevent="submitProfileReport()">
        <label class="sr-only" for="pfv-report-message" x-text="profileText('reportPlaceholder', 'Co jest nie tak?')"></label>
        <!-- the label names the field once; the grey hint is for the eye (a placeholder of the same text was read after the label) -->
        <div class="search-field">
          <textarea id="pfv-report-message" x-ref="profileReportMessage" x-model="profileReportMessage" maxlength="800" placeholder=" "></textarea>
          <span class="search-field__hint search-field__hint--top" aria-hidden="true" x-text="profileText('reportPlaceholder', 'Co jest nie tak?')"></span>
        </div>
        <label class="pfv-report__blank" aria-hidden="true"><input type="text" tabindex="-1" autocomplete="off" x-model="profileReportBlank"></label>
        <div class="pfv-report__buttons">
          <button type="submit" class="pfv-action pfv-action--strong" :disabled="profileReportSending" x-text="profileText('reportSend', 'Wyślij')"></button>
          <button type="button" class="pfv-action" @click="closeProfileReport()" x-text="profileText('reportCancel', 'Anuluj')"></button>
        </div>
      </form>
      <div class="pfv-report__buttons" x-show="profileReportStatus === 'sent'">
        <button type="button" class="pfv-action" @click="closeProfileReport()" x-text="profileText('reportClose', 'Zamknij')"></button>
      </div>
    </div>
  </div>
  </template>
</div>
