services:
  wyniki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wyniki-tenis-v2
    image: count-wyniki-v2:latest
    ports:
      - "8087:8080"
    volumes:
      - wyniki_data:/data
    environment:
      # Flask
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-me}
      - FLASK_ENV=production
      - DEBUG=false
      
      # Database
      - DATABASE_PATH=/data/wyniki.sqlite3
      
      # Admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # AI-assisted player import parsing
      - IMPORT_PLAYERS_AI_API_KEY=${IMPORT_PLAYERS_AI_API_KEY:-}
      - IMPORT_PLAYERS_AI_MODEL=${IMPORT_PLAYERS_AI_MODEL:-gemini-2.5-flash}
      - IMPORT_PLAYERS_AI_TIMEOUT_SECONDS=${IMPORT_PLAYERS_AI_TIMEOUT_SECONDS:-20}
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      # Public-site features, comma separated (e.g. court-next); set in the host's .env, off by default
      - PUBLIC_FEATURES=${PUBLIC_FEATURES:-}

      # UNO Overlays
      - UNO_BASE=${UNO_BASE:-https://app.overlays.uno/apiv2/controlapps}
      - KORT1_ID=${KORT1_ID}
      - KORT2_ID=${KORT2_ID}
      - KORT3_ID=${KORT3_ID}
      - KORT4_ID=${KORT4_ID}
      - UNO_AUTH_BEARER=${UNO_AUTH_BEARER:-}

      # Web Push for the public site. Empty = the feature stays off, which is
      # the default everywhere the keys are not set in the host's .env.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:kontakt@vestmedia.pl}

      # Umpire panic → WAHA. Empty = the endpoint stays off.
      - WAHA_URL=${WAHA_URL:-}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - PANIC_COOLDOWN_SECONDS=${PANIC_COOLDOWN_SECONDS:-60}

    restart: unless-stopped
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wyniki.rule=Host(`${PUBLIC_HOST}`) || Host(`${PUBLIC_HOST_ALT}`)"
      - "traefik.http.routers.wyniki.entrypoints=https"
      - "traefik.http.routers.wyniki.tls=true"
      - "traefik.http.services.wyniki.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/snapshot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - proxy

volumes:
  wyniki_data:
    external: true
    name: count_wyniki_data

networks:
  proxy:
    external: true
