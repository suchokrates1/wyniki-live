<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Score Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Chivo', system-ui, sans-serif;
            background: transparent;
            overflow: hidden;
            color: white;
        }
        .layout {
            position: fixed; width: 1920px; height: 1080px;
            transform-origin: top left;
            transition: opacity 1s ease;
        }
        .layout.auto-hidden { opacity: 0; pointer-events: none; }
        .element-wrapper {
            position: absolute;
            transition: left 0.4s ease, top 0.4s ease, width 0.4s ease, height 0.4s ease, opacity 0.5s ease;
            overflow: hidden;
        }
        .element-wrapper.el-hidden {
            opacity: 0; pointer-events: none; transform: translateY(-30px);
        }

        /* TV-style corner watermark */
        .ov-watermark {
            position: absolute; z-index: 90; pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }

        .element-wrapper.has-h { display: flex; flex-direction: column; }

        .sb-tv { width: 100%; height: auto; container-type: inline-size; }
        .element-wrapper.has-h .sb-tv { height: 100%; }
        .sb-tv.match-inactive { opacity: 0.45; }
        .sb-tv-card {
            position: relative; overflow: hidden; height: 100%;
            display: flex; flex-direction: column;
            border-radius: 6px;
            box-shadow: 0 26px 60px rgba(0,0,0,.55);
        }
        .sb-tv-header {
            display: flex; align-items: center; gap: 14px;
            height: 52px; flex-shrink: 0; padding: 0 16px;
            background: linear-gradient(90deg, #041519 0%, #06222B 100%);
            border-bottom: 1px solid rgba(255,212,0,.35);
        }
        .sb-tv-logo {
            width: 34px; height: 34px; border-radius: 4px; flex-shrink: 0;
            background: rgba(255,255,255,.1);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-size: 19px;
        }
        .sb-tv-logo img { width: 100%; height: 100%; object-fit: cover; }
        .sb-tv-meta {
            flex: 1 1 auto; min-width: 0;
            font-size: 15px; font-weight: 700; letter-spacing: .08em;
            color: rgba(255,255,255,.68); text-transform: uppercase;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .sb-tv-tb {
            flex-shrink: 0; font-size: 13px; font-weight: 900; letter-spacing: .16em;
            color: #06222B; background: #FFD400; padding: 4px 10px; border-radius: 3px;
            text-transform: uppercase; white-space: nowrap;
        }
        .sb-tv-court {
            flex: 0 1 auto; min-width: 0;
            font-size: 15px; font-weight: 700; letter-spacing: .1em;
            color: #fff; text-transform: uppercase;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .sb-tv-clock {
            flex-shrink: 0; font-family: 'Chivo Mono', monospace;
            font-size: 15px; font-weight: 700; color: #FFD400; letter-spacing: .04em;
        }
        .sb-tv-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .sb-tv-row {
            display: grid; align-items: stretch;
            grid-template-columns: var(--sb-cols);
            flex: 1; min-height: 66px;
            color: #fff;
        }
        .sb-tv-row.side-a { background: linear-gradient(90deg, #0B2C36 0%, #072530 100%); }
        .sb-tv-row.side-b {
            background: linear-gradient(90deg, #082530 0%, #05202a 100%);
            border-top: 1px solid rgba(255,255,255,.07);
        }
        .sb-tv-flag {
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,.25);
        }
        .player-flags { display: inline-flex; align-items: center; gap: 3px; }
        .player-flag {
            width: 40px; height: 26px; flex-shrink: 0; border-radius: 2px;
            background: #16303a; background-size: cover; background-position: center;
            box-shadow: 0 0 0 1px rgba(255,255,255,.3);
        }
        .player-flags .player-flag { width: 24px; height: 16px; }
        .sb-tv-player {
            display: flex; align-items: center; gap: 12px;
            padding: 0 20px; min-width: 0;
        }
        .player-name {
            font-size: 30px; font-weight: 900; letter-spacing: .01em;
            color: #fff; text-transform: uppercase;
            white-space: nowrap; overflow: hidden; min-width: 0; flex: 1;
        }
        .player-name.is-team { white-space: normal; line-height: 1.15; }
        .sb-tv-serve {
            display: block; width: 26px; height: 26px; flex: 0 0 26px; margin-left: auto;
            filter: drop-shadow(0 0 6px rgba(198,233,83,.5));
            opacity: 0; transition: opacity .3s ease;
        }
        .sb-tv-serve.is-on { opacity: 1; animation: servepulse 2.4s ease-in-out infinite; }
        .sb-tv-serve svg { width: 100%; height: 100%; display: block; }
        .sb-tv-set, .sb-tv-pts {
            display: flex; align-items: center; justify-content: center;
            border-left: 1px solid rgba(0,0,0,.35);
            font-family: 'Chivo Mono', monospace; font-weight: 700; line-height: 1;
        }
        .sb-tv-set { font-size: 29px; }
        .sb-tv-set.is-done { color: rgba(255,255,255,.5); background: rgba(255,255,255,.04); }
        .sb-tv-set.is-live { color: #fff; background: linear-gradient(180deg, #ff7a1c 0%, #d64900 100%); }
        .sb-tv-set.is-live.is-gameflash-a { animation: gameflash-a .7s ease; }
        .sb-tv-set.is-live.is-gameflash-b { animation: gameflash-b .7s ease; }
        .sb-tv-set.is-colin-a { animation: colin-a .55s ease; }
        .sb-tv-set.is-colin-b { animation: colin-b .55s ease; }
        .sb-tv-sup {
            font-size: 15px; line-height: 1; position: relative; top: -11px; opacity: .85; margin-left: 2px;
        }
        .sb-tv-pts { font-size: 34px; color: #fff; background: #0F3A47; }
        .sb-tv-pts.is-tiebreak { background: #FFD400; color: #06222B; }
        .sb-tv-pts.is-ptflash-a { animation: ptflash-a .5s ease; }
        .sb-tv-pts.is-ptflash-b { animation: ptflash-b .5s ease; }
        .sb-tv-wipe {
            position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(100deg, rgba(255,212,0,0) 0%, rgba(255,212,0,.5) 45%, rgba(255,255,255,.75) 55%, rgba(255,212,0,0) 100%);
            opacity: 0;
        }
        .sb-tv-wipe.is-setwipe-a { animation: setwipe-a 1.1s ease; }
        .sb-tv-wipe.is-setwipe-b { animation: setwipe-b 1.1s ease; }

        @keyframes ptflash-a { 0% { background-color: #FFD400; color: #06222B; } 100% { background-color: #0F3A47; color: #fff; } }
        @keyframes ptflash-b { 0% { background-color: #FFD400; color: #06222B; } 100% { background-color: #0F3A47; color: #fff; } }
        @keyframes gameflash-a { 0% { transform: scale(1); box-shadow: inset 0 0 0 3px #FFD400; } 40% { transform: scale(1.12); } 100% { transform: scale(1); box-shadow: inset 0 0 0 0 rgba(255,212,0,0); } }
        @keyframes gameflash-b { 0% { transform: scale(1); box-shadow: inset 0 0 0 3px #FFD400; } 40% { transform: scale(1.12); } 100% { transform: scale(1); box-shadow: inset 0 0 0 0 rgba(255,212,0,0); } }
        @keyframes setwipe-a { 0% { transform: translateX(-100%); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateX(105%); opacity: 0; } }
        @keyframes setwipe-b { 0% { transform: translateX(-100%); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateX(105%); opacity: 0; } }
        @keyframes servepulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .72; transform: scale(.88); } }
        @keyframes colin-a { 0% { opacity: 0; transform: translateX(-26px); } 60% { opacity: 1; } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes colin-b { 0% { opacity: 0; transform: translateX(-26px); } 60% { opacity: 1; } 100% { opacity: 1; transform: translateX(0); } }

        @container (max-width: 520px) {
            .sb-tv-header { height: 36px; gap: 8px; padding: 0 10px; }
            .sb-tv-logo { width: 24px; height: 24px; font-size: 14px; }
            .sb-tv-meta, .sb-tv-court { font-size: 11px; }
            .sb-tv-clock { font-size: 12px; }
            .sb-tv-tb { font-size: 10px; padding: 2px 6px; }
            .sb-tv-player { padding: 0 10px; gap: 8px; }
            .player-name { font-size: 18px; }
            .sb-tv-serve { width: 18px; height: 18px; flex-basis: 18px; }
            .sb-tv-set { font-size: 20px; }
            .sb-tv-pts { font-size: 22px; }
            .sb-tv-sup { font-size: 11px; top: -7px; }
            .player-flag { width: 28px; height: 18px; }
        }

        /* ---- Stats panel ---- */
        .stats-panel {
            width: 100%;
            background: linear-gradient(135deg, rgba(30,30,30,0.95), rgba(50,50,50,0.92));
            border-radius: 12px; padding: 16px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.12);
        }
        .stats-title {
            text-align: center; font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 12px; opacity: 0.7;
        }
        .stats-header {
            display: grid; grid-template-columns: 1fr 60px 60px;
            gap: 4px; margin-bottom: 6px; padding-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .stats-header .player-col {
            text-align: center; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .stats-row {
            display: grid; grid-template-columns: 1fr 60px 60px;
            gap: 4px; padding: 4px 0;
        }
        .stats-row:nth-child(even) { background: rgba(255,255,255,0.04); border-radius: 4px; }
        .stat-label { font-size: 13px; font-weight: 500; opacity: 0.9; }
        .stat-value { text-align: center; font-size: 14px; font-weight: 700; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const hasTournamentSlot = pathParts[0] === 'overlay' && pathParts.length >= 3;
    const overlayId = hasTournamentSlot ? (pathParts[2] || '1') : (pathParts[pathParts.length - 1] || '1');
    const requestedTournamentSlot = hasTournamentSlot ? (parseInt(pathParts[1], 10) || 1) : null;
    const SETTINGS_POLL_MS = 2000;
    let allCourtIds = [];  // Will be populated from snapshot

    function codeToFlag(code) {
        if (!code || code.length < 2) return '';
        return 'https://flagcdn.com/w80/' + code.toLowerCase().slice(0, 2) + '.png';
    }
    let courts = {};
    let settings = { tournament_logo: null, tournament_name: '', overlays: {} };
    let activeTournaments = [];
    let activeTournament = null;
    let eventSource = null;
    let scoreAnim = {};
    const SERVE_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#C6E953" stroke="#ffffff" stroke-width="2"></circle><path d="M6.2 6.4c5.4 4.5 5.4 14.7 0 19.2" fill="none" stroke="#ffffff" stroke-width="2"></path><path d="M25.8 6.4c-5.4 4.5-5.4 14.7 0 19.2" fill="none" stroke="#ffffff" stroke-width="2"></path></svg>';

    function getPreset() {
        return settings.overlays?.[overlayId] || { name: '', auto_hide: false, elements: [] };
    }

    function isPlaceholderName(value) {
        var raw = String(value || '').trim();
        return !raw || raw === '-' || raw === '\u2014' || raw === '\u2013';
    }

    function courtHasPlayers(court) {
        if (!court) return false;
        var a = court.A || {};
        var b = court.B || {};
        return !isPlaceholderName(a.full_name || a.surname) || !isPlaceholderName(b.full_name || b.surname);
    }

    function isElementCourtOccupied(el) {
        return courtHasPlayers(resolveCourtState(el && el.court_id));
    }

    function overlayHasOccupiedCourt(preset) {
        return (preset.elements || []).some(isElementCourtOccupied);
    }

    function sortCourtIds(ids) {
        return ids.slice().sort(function(a, b) {
            return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
        });
    }

    function syncTournamentContext() {
        var resolved = null;
        if (requestedTournamentSlot != null) {
            resolved = activeTournaments[requestedTournamentSlot - 1] || null;
        }
        if (!resolved) {
            var presetTournamentId = getPreset()?.tournament_id;
            if (presetTournamentId != null) {
                resolved = activeTournaments.find(function(tournament) {
                    return String(tournament.id) === String(presetTournamentId);
                }) || null;
            }
        }
        activeTournament = resolved || activeTournaments[0] || null;
        if (activeTournament?.name) {
            document.title = activeTournament.name + ' - Tennis Score Overlay';
        }
    }

    function getTournamentBranding() {
        return {
            logo: activeTournament?.logo_path || settings.tournament_logo || null,
            name: activeTournament?.name || settings.tournament_name || '',
        };
    }

    function getTournamentCourtEntries() {
        var entries = Object.keys(courts).map(function(kortId) {
            return { kortId: kortId, court: courts[kortId] || {} };
        });
        if (activeTournament?.id != null) {
            entries = entries.filter(function(entry) {
                return String(entry.court?.tournament_id) === String(activeTournament.id);
            });
            entries.sort(function(a, b) {
                var orderA = parseInt(a.court?.display_order, 10);
                var orderB = parseInt(b.court?.display_order, 10);
                if (!Number.isNaN(orderA) || !Number.isNaN(orderB)) {
                    return (Number.isNaN(orderA) ? Number.MAX_SAFE_INTEGER : orderA) - (Number.isNaN(orderB) ? Number.MAX_SAFE_INTEGER : orderB);
                }
                return String(a.court?.name || a.kortId).localeCompare(String(b.court?.name || b.kortId), undefined, { numeric: true, sensitivity: 'base' });
            });
            return entries;
        }
        return sortCourtIds(entries.map(function(entry) { return entry.kortId; })).map(function(kortId) {
            return { kortId: kortId, court: courts[kortId] || {} };
        });
    }

    function resolveCourtState(courtToken) {
        if (activeTournament?.id != null) {
            var ordinal = parseInt(courtToken, 10);
            if (!Number.isNaN(ordinal) && ordinal > 0) {
                var mapped = getTournamentCourtEntries()[ordinal - 1];
                if (mapped) return mapped.court || {};
            }
        }
        return courts[courtToken] || {};
    }

    function getTrackedCourtIds() {
        var tournamentCourtIds = getTournamentCourtEntries().map(function(entry) { return entry.kortId; });
        return tournamentCourtIds.length ? tournamentCourtIds : allCourtIds;
    }

    function toFiniteSeconds(value) {
        var numeric = Number(value);
        return Number.isFinite(numeric) ? numeric : null;
    }

    function parseTimestampSeconds(value) {
        if (value == null || value === '') return null;
        var numeric = toFiniteSeconds(value);
        if (numeric != null) return numeric;
        var parsed = Date.parse(value);
        return Number.isFinite(parsed) ? parsed / 1000 : null;
    }

    function calcMatchTime(court) {
        if (!court || !court.match_status?.active || !court.match_time) return null;
        var mt = court.match_time;
        var secs = null;
        var startedTs = parseTimestampSeconds(mt.started_ts);
        if (mt.running && startedTs != null) {
            secs = Math.max(0, (Date.now() / 1000) - startedTs);
        } else if (mt.running) {
            secs = toFiniteSeconds(mt.offset_seconds) || 0;
            var resumeTs = parseTimestampSeconds(mt.resume_ts);
            if (resumeTs != null) secs += Math.max(0, (Date.now() / 1000) - resumeTs);
        } else {
            secs = toFiniteSeconds(mt.seconds);
            if (secs == null || secs <= 0) return null;
        }
        secs = Math.max(0, Math.floor(secs));
        var hh = String(Math.floor(secs/3600)).padStart(2,'0');
        var mm = String(Math.floor((secs%3600)/60)).padStart(2,'0');
        return hh+':'+mm;
    }

    function overlayCourtLabel(labelText, courtId) {
        var raw = String(labelText || '').trim();
        if (/^main$/i.test(raw)) return 'MAIN';
        var fromId = String(courtId || '').match(/(?:^|-)(\d+)$/);
        var ordinalFromId = fromId ? fromId[1] : '';
        if (!raw) return ordinalFromId ? 'COURT ' + ordinalFromId : '';
        var afterDot = raw.split('•').pop().trim();
        var stripped = afterDot.replace(/^(court|kort|platz|campo|cancha|kortas)\s+/i, '').trim();
        if (/^\d+$/.test(stripped)) return 'COURT ' + stripped;
        return afterDot.replace(/^(court|kort|platz|campo|cancha|kortas)\s+/i, 'COURT ');
    }

    function overlayCategoryLabel(category) {
        var text = String(category || '').trim();
        if (!text) return '';
        if (text.indexOf(' — ') >= 0) text = text.split(' — ')[0].trim();
        return text
            .replace(/Kobiety/gi, 'Women')
            .replace(/Mężczyźni/gi, 'Men')
            .replace(/Mezczyzni/gi, 'Men')
            .replace(/\bWoman\b/gi, 'Women')
            .replace(/\bMan\b/gi, 'Men')
            .replace(/\bDebel\b/gi, 'Doubles')
            .replace(/\bDeble\b/gi, 'Doubles')
            .replace(/\bMieszane\b/gi, 'Mixed');
    }

    function overlayPhaseLabel(phase) {
        var text = String(phase || '').trim();
        if (!text) return '';
        var suffix = text.indexOf(' — ') >= 0 ? text.split(' — ').pop().trim() : text;
        var lower = suffix.toLowerCase();
        if (/rewan|rematch/.test(lower)) return 'GROUP REMATCH';
        if (lower === 'grupowa' || /group stage|^group$|faza grupowa/.test(lower)) return 'GROUP';
        if (/1\s*\/\s*8|r16|round of 16|ósem/.test(lower)) return '1/8';
        if (/1\s*\/\s*4|ćwierć|cwierc|quarter/.test(lower)) return '1/4';
        if (/1\s*\/\s*2|półfina|polfina|semif/.test(lower)) return '1/2';
        if (/3\.\s*miejsce|3rd|third place|bronze/.test(lower)) return '3RD PLACE';
        if (/pucharowa|knockout/.test(lower)) return 'KNOCKOUT';
        if (/(?:^|\s)fina[lł]|final/.test(lower) && !/semi|pół|1\s*\/\s*2/.test(lower)) return 'FINAL';
        return suffix;
    }

    function tbSuperscripts(setInfo) {
        if (!setInfo || setInfo.tb == null || setInfo.stb) return { a: '', b: '' };
        var a = Number(setInfo.p1 || 0), b = Number(setInfo.p2 || 0);
        if (a === b) return { a: '', b: '' };
        var tb = String(setInfo.tb);
        return a < b ? { a: tb, b: '' } : { a: '', b: tb };
    }

    function setCellHtml(val, sup, kind, flashCls) {
        var supHtml = sup ? '<span class="sb-tv-sup">' + sup + '</span>' : '';
        var cls = 'sb-tv-set ' + kind + (flashCls ? ' ' + flashCls : '');
        return '<div class="' + cls + '"><span>' + val + '</span>' + supHtml + '</div>';
    }

    function takeScoreAnim(cid, sig) {
        var prev = scoreAnim[cid];
        if (!prev) {
            scoreAnim[cid] = {
                ptsA: sig.ptsA, ptsB: sig.ptsB, gamesA: sig.gamesA, gamesB: sig.gamesB, sets: sig.sets,
                tickPtsA: 0, tickPtsB: 0, tickGameA: 0, tickGameB: 0, tickSet: 0,
            };
            return { tickPtsA: 0, tickPtsB: 0, tickGameA: 0, tickGameB: 0, tickSet: 0, just: {} };
        }
        var just = {
            ptsA: sig.ptsA !== prev.ptsA,
            ptsB: sig.ptsB !== prev.ptsB,
            gamesA: sig.gamesA !== prev.gamesA,
            gamesB: sig.gamesB !== prev.gamesB,
            sets: sig.sets !== prev.sets,
        };
        var next = {
            ptsA: sig.ptsA, ptsB: sig.ptsB, gamesA: sig.gamesA, gamesB: sig.gamesB, sets: sig.sets,
            tickPtsA: prev.tickPtsA + (just.ptsA ? 1 : 0),
            tickPtsB: prev.tickPtsB + (just.ptsB ? 1 : 0),
            tickGameA: prev.tickGameA + (just.gamesA ? 1 : 0),
            tickGameB: prev.tickGameB + (just.gamesB ? 1 : 0),
            tickSet: prev.tickSet + (just.sets ? 1 : 0),
        };
        scoreAnim[cid] = next;
        return { tickPtsA: next.tickPtsA, tickPtsB: next.tickPtsB, tickGameA: next.tickGameA, tickGameB: next.tickGameB, tickSet: next.tickSet, just: just };
    }

    function flashCls(prefix, tick, changed) {
        if (!changed || !tick) return '';
        return 'is-' + prefix + '-' + (tick % 2 === 0 ? 'a' : 'b');
    }

    function renderScoreboard(el) {
        const cid = el.court_id;
        const court = resolveCourtState(cid);
        const pA = court.A || {}, pB = court.B || {};
        const active = court.match_status?.active || false;
        const inactiveClass = active ? '' : ' match-inactive';
        const curSet = court.current_set || 1;
        const bgOpacity = el.bg_opacity != null ? el.bg_opacity : 0.95;
        const hasSetDetail = Array.isArray(court.sets_detail) && court.sets_detail.length > 0;
        const regularSetWins = (function() {
            const wins = { A: 0, B: 0 };
            if (hasSetDetail) {
                for (const setInfo of court.sets_detail) {
                    if (setInfo?.stb) continue;
                    const a = Number(setInfo?.p1 ?? 0);
                    const b = Number(setInfo?.p2 ?? 0);
                    if (a > b) wins.A += 1;
                    else if (b > a) wins.B += 1;
                }
                return wins;
            }
            for (let setIdx = 1; setIdx <= 2; setIdx += 1) {
                const a = Number(pA['set'+setIdx] || 0);
                const b = Number(pB['set'+setIdx] || 0);
                if (a > b) wins.A += 1;
                else if (b > a) wins.B += 1;
            }
            return wins;
        })();
        const isSuperTB = !!court.super_tiebreak_active || (Number(curSet) === 3 && regularSetWins.A === 1 && regularSetWins.B === 1);
        const readSetValue = (playerState, setIdx) => {
            if (active && setIdx > curSet) return 0;
            return playerState['set'+setIdx] || 0;
        };
        const completed = [];
        if (hasSetDetail) {
            court.sets_detail.forEach(function(d) {
                if (d?.stb) return;
                var sup = tbSuperscripts(d);
                completed.push({ a: Number(d.p1 || 0), b: Number(d.p2 || 0), supA: sup.a, supB: sup.b });
            });
        } else {
            var lastCompleted = active ? (curSet - 1) : 3;
            for (var s = 1; s <= lastCompleted && s <= 3; s++) {
                var a = Number(readSetValue(pA, s) || 0), b = Number(readSetValue(pB, s) || 0);
                if (!active && a === 0 && b === 0) continue;
                completed.push({ a: a, b: b, supA: '', supB: '' });
            }
        }
        const liveGames = (active && !isSuperTB)
            ? { a: Number(readSetValue(pA, curSet) || 0), b: Number(readSetValue(pB, curSet) || 0) }
            : null;
        const isTie = court.tie?.visible || false;
        const ptA = active ? ((isTie || isSuperTB) ? (court.tie?.A || 0) : (pA.points || '0')) : '\u2014';
        const ptB = active ? ((isTie || isSuperTB) ? (court.tie?.B || 0) : (pB.points || '0')) : '\u2014';
        const tbOn = active && (isTie || isSuperTB);
        const logo = getTournamentBranding().logo;
        const showLogo = el.show_logo !== false;
        const meta = court.history_meta || {};
        const cat = overlayCategoryLabel(meta.category);
        const phase = overlayPhaseLabel(meta.phase);
        const metaParts = [cat, phase].filter(Boolean).join(' · ');
        const showHeaderCourt = (el.label_position || 'above') !== 'none';
        const courtName = showHeaderCourt ? overlayCourtLabel(el.label_text, el.court_id) : '';
        const timeStr = calcMatchTime(court) || '';
        const colCount = completed.length + (liveGames ? 1 : 0);
        const gridCols = '52px 1fr repeat(' + Math.max(colCount, 0) + ', minmax(36px, 64px)) minmax(56px, 96px)';
        const anim = takeScoreAnim(cid, {
            ptsA: String(ptA), ptsB: String(ptB),
            gamesA: liveGames ? String(liveGames.a) : '',
            gamesB: liveGames ? String(liveGames.b) : '',
            sets: completed.map(function(c) { return c.a + '-' + c.b; }).join('|'),
        });
        const gameFlashA = flashCls('gameflash', anim.tickGameA, !!anim.just.gamesA);
        const gameFlashB = flashCls('gameflash', anim.tickGameB, !!anim.just.gamesB);
        const setIn = flashCls('colin', anim.tickSet, !!anim.just.sets);
        const ptsFlashA = flashCls('ptflash', anim.tickPtsA, !!anim.just.ptsA);
        const ptsFlashB = flashCls('ptflash', anim.tickPtsB, !!anim.just.ptsB);
        const wipeCls = flashCls('setwipe', anim.tickSet, !!anim.just.sets);

        function pRow(p, serveKey, sideClass) {
            var isServing = court.serve === serveKey;
            var flagHtml = flagSpans(p) || '<span class="player-flag"></span>';
            var dName = p.full_name || p.surname || '\u2014';
            var isTeam = String(dName).indexOf(' / ') !== -1;
            var shown = isTeam ? abbreviateName(dName) : dName;
            var teamClass = isTeam ? ' is-team' : '';
            var serveCls = isServing ? ' is-on' : '';
            var setHtml = completed.map(function(c, i) {
                var val = serveKey === 'A' ? c.a : c.b;
                var sup = serveKey === 'A' ? c.supA : c.supB;
                var flash = (i === completed.length - 1) ? setIn : '';
                return setCellHtml(val, sup, 'is-done', flash);
            }).join('');
            if (liveGames) {
                var liveVal = serveKey === 'A' ? liveGames.a : liveGames.b;
                var liveFlash = serveKey === 'A' ? gameFlashA : gameFlashB;
                setHtml += setCellHtml(liveVal, '', 'is-live', liveFlash);
            }
            var ptsVal = serveKey === 'A' ? ptA : ptB;
            var ptsFlash = serveKey === 'A' ? ptsFlashA : ptsFlashB;
            return '<div class="sb-tv-row ' + sideClass + '">'
                + '<div class="sb-tv-flag">' + flagHtml + '</div>'
                + '<div class="sb-tv-player"><span class="player-name' + teamClass + '" data-full="' + dName.replace(/"/g, '&quot;') + '">' + shown + '</span>'
                + '<span class="sb-tv-serve' + serveCls + '">' + SERVE_SVG + '</span></div>'
                + setHtml
                + '<div class="sb-tv-pts' + (tbOn ? ' is-tiebreak' : '') + (ptsFlash ? ' ' + ptsFlash : '') + '">' + ptsVal + '</div>'
                + '</div>';
        }

        var logoHtml = (showLogo && logo)
            ? '<div class="sb-tv-logo"><img src="' + logo + '" alt=""></div>'
            : '<div class="sb-tv-logo">&#127934;</div>';

        var tbHtml = '';
        if (tbOn) tbHtml = '<span class="sb-tv-tb">' + (isSuperTB ? 'Super tie-break' : 'Tie-break') + '</span>';
        var clockHtml = timeStr
            ? '<span class="sb-tv-clock" data-court="' + cid + '">' + timeStr + '</span>'
            : '';
        var opacityStyle = bgOpacity < 1 ? 'opacity:' + bgOpacity + ';' : '';

        return '<div class="sb-tv' + inactiveClass + '" style="' + opacityStyle + '--sb-cols:' + gridCols + ';">'
            + '<div class="sb-tv-card">'
            + '<div class="sb-tv-header">' + logoHtml
            + '<span class="sb-tv-meta">' + metaParts + '</span>'
            + tbHtml
            + (courtName ? '<span class="sb-tv-court">' + courtName + '</span>' : '')
            + clockHtml + '</div>'
            + '<div class="sb-tv-rows">'
            + pRow(pA, 'A', 'side-a')
            + pRow(pB, 'B', 'side-b')
            + '</div>'
            + '<div class="sb-tv-wipe' + (wipeCls ? ' ' + wipeCls : '') + '"></div>'
            + '</div></div>';
    }

    function _v(val, suffix) { return val != null ? val + (suffix||'') : '\u2014'; }
    function _serveRatio(si, st) { return (si != null && st != null) ? si+'/'+st : '\u2014'; }
    function _totalPtsWon(own, opp) {
        var a = (own.aces||0) + (own.winners||0);
        var b = (opp.double_faults||0) + (opp.forced_errors||0) + (opp.unforced_errors||0);
        return a + b;
    }

    function renderStats(el) {
        var court = resolveCourtState(el.court_id);
        var active = court.match_status?.active || false;
        if (!active) return '';
        var st = court.stats || {};
        var pA = court.A || {}, pB = court.B || {};
        var nA = pA.full_name||pA.surname||'A';
        var nB = pB.full_name||pB.surname||'B';
        if (String(nA).indexOf(' / ') !== -1) nA = abbreviateName(nA);
        if (String(nB).indexOf(' / ') !== -1) nB = abbreviateName(nB);
        var sA = st.player_a||{}, sB = st.player_b||{};
        var mode = el.stats_mode || 'simple';
        var rows = [
            {l:'Asy', a:_v(sA.aces), b:_v(sB.aces)},
            {l:'Podw. b\u0142\u0119dy', a:_v(sA.double_faults), b:_v(sB.double_faults)},
            {l:'Winnery', a:_v(sA.winners), b:_v(sB.winners)},
        ];
        if (mode === 'advanced') {
            rows.push({l:'B\u0142. wymuszone', a:_v(sA.forced_errors), b:_v(sB.forced_errors)});
        }
        rows.push({l:'B\u0142. niewymuszone', a:_v(sA.unforced_errors), b:_v(sB.unforced_errors)});
        if (mode === 'advanced') {
            rows.push({l:'1. serwis', a:_serveRatio(sA.first_serves_in, sA.first_serves_total), b:_serveRatio(sB.first_serves_in, sB.first_serves_total)});
        }
        rows.push({l:'1. serwis %', a:_v(sA.first_serve_pct,'%'), b:_v(sB.first_serve_pct,'%')});
        if (mode === 'advanced') {
            rows.push({l:'2. serwis %', a:_v(sA.second_serve_pct,'%'), b:_v(sB.second_serve_pct,'%')});
            rows.push({l:'Pkt wygrane', a:_totalPtsWon(sA,sB), b:_totalPtsWon(sB,sA)});
        }
        var title = mode === 'advanced' ? 'Statystyki zaawansowane' : 'Statystyki';
        return '<div class="stats-panel">'
            +'<div class="stats-title">'+title+'</div>'
            +'<div class="stats-header"><div></div><div class="player-col">'+nA+'</div><div class="player-col">'+nB+'</div></div>'
            +rows.map(function(r){return '<div class="stats-row"><div class="stat-label">'+r.l+'</div><div class="stat-value">'+r.a+'</div><div class="stat-value">'+r.b+'</div></div>';}).join('')
            +'</div>';
    }

    function estimateTopSlotHeight(el) {
        return 184;
    }

    function renderWatermark(preset) {
        var wm = preset.watermark;
        if (!wm || !wm.enabled) return '';
        // Vest Media brand (same file as vestmedia.pl footer) — not tournament logo
        var logo = '/vest-media-logo.png';
        var size = wm.size || 140;
        var opacity = wm.opacity != null ? wm.opacity : 0.4;
        var margin = 36;
        var pos = wm.position || 'bottom-right';
        var place = '';
        if (pos === 'top-left') place = 'left:'+margin+'px;top:'+margin+'px;';
        else if (pos === 'top-right') place = 'right:'+margin+'px;top:'+margin+'px;';
        else if (pos === 'bottom-left') place = 'left:'+margin+'px;bottom:'+margin+'px;';
        else place = 'right:'+margin+'px;bottom:'+margin+'px;';
        return '<img class="ov-watermark" src="'+logo+'" alt="Vest Media" style="'+place+'width:'+size+'px;height:'+size+'px;opacity:'+opacity+';">';
    }

    function render() {
        var preset = getPreset();
        var anyOccupied = overlayHasOccupiedCourt(preset);
        var autoHidden = preset.auto_hide && !anyOccupied;
        var sx = window.innerWidth / 1920;
        var sy = window.innerHeight / 1080;
        var scale = Math.min(sx, sy);
        var elems = preset.elements || [];

        // Apply top-bar grid positioning (mirrors admin overlay.js)
        if (preset.top_bar?.enabled) {
            var topEls = elems.filter(function(e){ return e.zone === 'top'; });
            if (topEls.length > 0) {
                var cols = preset.top_bar.columns || 3;
                var mx = preset.top_bar.margin_x || 0;
                var mt = preset.top_bar.margin_top || 0;
                var gap = preset.top_bar.gap || 10;
                var totalW = 1920 - 2 * mx;
                var usable = topEls.length > cols ? cols : topEls.length;
                var colW = Math.round((totalW - (usable - 1) * gap) / usable);
                var slotH = null;
                if (preset.top_bar.reserve_expanded !== false) {
                    slotH = Math.max.apply(null, topEls.map(estimateTopSlotHeight));
                } else if (topEls[0].h) {
                    slotH = topEls[0].h;
                }
                topEls.forEach(function(el, i) {
                    if (i >= cols) return;
                    el.x = Math.round(mx + i * (colW + gap));
                    el.y = mt;
                    el.w = colW;
                    if (slotH) el.h = slotH;
                });
            }
        }

        var html = elems.map(function(el) {
            var hidden = el.visible === false ? 'el-hidden' : '';
            if (!hidden && preset.auto_hide && !isElementCourtOccupied(el)) hidden = 'el-hidden';
            var style = 'left:'+el.x+'px;top:'+el.y+'px;width:'+el.w+'px;';
            if (el.h) style += 'height:'+el.h+'px;';
            var hClass = el.h ? ' has-h' : '';
            if (el.type === 'stats') {
                return '<div class="element-wrapper '+hidden+hClass+'" style="'+style+'">'+renderStats(el)+'</div>';
            }
            return '<div class="element-wrapper '+hidden+hClass+'" style="'+style+'">'+renderScoreboard(el)+'</div>';
        }).join('');
        html += renderWatermark(preset);
        document.getElementById('app').innerHTML =
            '<div class="layout '+(autoHidden?'auto-hidden':'')+'" style="transform:scale('+scale+')">'+html+'</div>';
    }

    function connectSSE() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource('/api/stream');
        eventSource.addEventListener('court_update', function(e) {
            try {
                var d = JSON.parse(e.data);
                if (d.court_id) {
                    var cid = d.court_id;
                    delete d.court_id;
                    courts[cid] = d;
                    // Track new court IDs dynamically
                    if (allCourtIds.indexOf(cid) < 0) {
                        allCourtIds.push(cid);
                        allCourtIds = sortCourtIds(allCourtIds);
                    }
                    render();
                    requestAnimationFrame(fitPlayerNames);
                }
            } catch(err) { console.error('SSE parse:', err); }
        });
        eventSource.onerror = function() { eventSource.close(); setTimeout(connectSSE, 5000); };
    }

    async function loadSnapshot() {
        try {
            var r = await fetch('/api/snapshot');
            var d = await r.json();
            var c = d.courts || d;
            Object.keys(c).forEach(function(id){ courts[id] = c[id]; });
            // Update dynamic court ID list
            allCourtIds = sortCourtIds(Object.keys(c));
        } catch(e) { console.error('Snapshot:', e); }
    }

    async function loadSettings() {
        try {
            var r = await fetch('/api/overlay/settings');
            if (r.ok) {
                settings = await r.json();
                syncTournamentContext();
            }
        } catch(e) { /* defaults */ }
    }

    async function loadActiveTournaments() {
        try {
            var r = await fetch('/api/tournaments/active');
            if (r.ok) {
                activeTournaments = await r.json();
            }
        } catch(e) { /* defaults */ }
        syncTournamentContext();
    }

    function abbreviatePersonName(name) {
        var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (parts.length < 2) return name;
        var surname = parts[parts.length - 1];
        var initials = parts.slice(0, -1).map(function(p) { return p.charAt(0).toUpperCase() + '.'; }).join(' ');
        return initials + ' ' + surname;
    }

    function abbreviateName(name) {
        var raw = String(name || '');
        if (raw.indexOf(' / ') !== -1) {
            return raw.split(' / ').map(abbreviatePersonName).join(' / ');
        }
        return abbreviatePersonName(raw);
    }

    function flagSpans(p) {
        var html = '';
        var flagUrl = p.flag_url || (p.flag_code ? codeToFlag(p.flag_code) : '');
        var partnerUrl = p.flag_url_partner || (p.flag_code_partner ? codeToFlag(p.flag_code_partner) : '');
        var primary = String(p.flag_code || '').toUpperCase();
        var partner = String(p.flag_code_partner || '').toUpperCase();
        if (flagUrl) {
            html += '<span class="player-flag has-image" style="background-image:url('+flagUrl+')"></span>';
        }
        if (partnerUrl && partner && partner !== primary) {
            html += '<span class="player-flag has-image" style="background-image:url('+partnerUrl+')"></span>';
        }
        return html ? '<span class="player-flags">'+html+'</span>' : '';
    }

    function fitPlayerNames() {
        document.querySelectorAll('.player-name').forEach(function(el) {
            el.style.transform = '';
            el.style.overflow = 'hidden';
            var fullName = el.getAttribute('data-full') || el.textContent;
            el.textContent = fullName;
            var isTeam = String(fullName).indexOf(' / ') !== -1;
            if (isTeam) {
                el.classList.add('is-team');
                el.style.whiteSpace = 'normal';
                el.textContent = abbreviateName(fullName);
                return;
            }
            var sw = el.scrollWidth;
            var cw = el.clientWidth;
            if (sw <= cw + 1) return;
            var scale = cw / sw;
            // Moderate overflow – just compress
            if (scale >= 0.75) {
                el.style.overflow = 'visible';
                el.style.transform = 'scaleX(' + scale + ')';
                el.style.transformOrigin = 'left center';
                return;
            }
            // Heavy overflow – abbreviate first name(s) to initials
            var abbr = abbreviateName(fullName);
            if (abbr !== fullName) {
                el.textContent = abbr;
                sw = el.scrollWidth;
            }
            if (sw > cw + 1) {
                scale = cw / sw;
                el.style.overflow = 'visible';
                el.style.transform = 'scaleX(' + Math.max(scale, 0.55) + ')';
                el.style.transformOrigin = 'left center';
            }
        });
    }

    async function init() {
        await Promise.all([loadSnapshot(), loadSettings(), loadActiveTournaments()]);
        render();
        requestAnimationFrame(fitPlayerNames);
        connectSSE();
        setInterval(async function() {
            await Promise.all([loadSettings(), loadActiveTournaments()]);
            render();
            requestAnimationFrame(fitPlayerNames);
        }, SETTINGS_POLL_MS);
        setInterval(function() {
            document.querySelectorAll('.sb-tv-clock').forEach(function(el) {
                var cid = el.getAttribute('data-court');
                var court = cid ? resolveCourtState(cid) : null;
                var timeStr = calcMatchTime(court);
                if (timeStr) el.textContent = timeStr;
            });
        }, 1000);
        window.addEventListener('resize', function() { render(); requestAnimationFrame(fitPlayerNames); });
    }
    init();
    window.addEventListener('beforeunload', function() { if (eventSource) eventSource.close(); });
    </script>
</body>
